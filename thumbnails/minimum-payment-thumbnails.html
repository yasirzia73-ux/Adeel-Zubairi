<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minimum Payment Trap - YouTube Thumbnails A/B</title>
<meta name="hz:slide-selector" content=".slide">
<meta name="hz:canvas-width" content="1280">
<meta name="hz:canvas-height" content="720">
<link rel="stylesheet" href="https://use.typekit.net/suy2odm.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: "montserrat", "Montserrat", sans-serif;
    background: #0F172A;
  }
  .abs { position: absolute; }

  /* ---------- Thumbnail A: couch ---------- */
  .a-glow {
    left: -80px; top: 40px; width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(239,68,68,0.38) 0%, rgba(239,68,68,0.10) 45%, rgba(15,23,42,0) 70%);
  }
  .a-couch { left: 30px; top: 230px; width: 640px; height: 427px; }
  .a-tag {
    left: 385px; top: 168px; width: 250px; height: 112px;
    background: #F8FAFC; border-radius: 18px;
    transform: rotate(-10deg);
    box-shadow: 0 14px 30px rgba(0,0,0,0.45);
  }
  .a-tag-text {
    left: 385px; top: 168px; width: 250px; height: 112px;
    transform: rotate(-10deg);
    margin: 0; font-weight: 900; font-size: 62px; line-height: 112px;
    text-align: center; color: #0F172A; letter-spacing: -1px;
  }
  .a-tag-strike {
    left: 395px; top: 214px; width: 230px; height: 12px;
    background: #EF4444; border-radius: 6px; transform: rotate(-16deg);
  }
  .a-label {
    left: 690px; top: 120px; width: 560px; margin: 0;
    font-weight: 800; font-size: 72px; line-height: 1;
    color: #F8FAFC; text-align: center; letter-spacing: 1px;
  }
  .a-new {
    left: 660px; top: 215px; width: 620px; margin: 0;
    font-weight: 900; font-size: 176px; line-height: 1;
    color: #EF4444; text-align: center; letter-spacing: -5px;
    text-shadow: 0 8px 0 #7F1D1D;
  }
  .a-pill {
    left: 728px; top: 455px; width: 484px; height: 132px;
    background: #EAB308; border-radius: 26px;
    transform: rotate(-3deg);
    box-shadow: 0 12px 0 #854D0E;
  }
  .a-pill-text {
    left: 728px; top: 455px; width: 484px; height: 132px; margin: 0;
    transform: rotate(-3deg);
    font-weight: 900; font-size: 92px; line-height: 132px; text-align: center;
    color: #0F172A; letter-spacing: -2px;
  }

  /* ---------- Thumbnail B: mousetrap ---------- */
  .b-glow {
    left: -60px; top: 80px; width: 820px; height: 720px;
    background: radial-gradient(circle, rgba(234,179,8,0.30) 0%, rgba(234,179,8,0.08) 45%, rgba(15,23,42,0) 70%);
  }
  .b-trap { left: 10px; top: 170px; width: 720px; height: 473px; }
  .b-the {
    left: 740px; top: 100px; width: 500px; margin: 0;
    font-weight: 800; font-size: 74px; line-height: 1; color: #F8FAFC; letter-spacing: 2px;
  }
  .b-minimum {
    left: 736px; top: 182px; width: 520px; margin: 0;
    font-weight: 900; font-size: 100px; line-height: 1; color: #EF4444; letter-spacing: -4px;
    text-shadow: 0 7px 0 #7F1D1D;
  }
  .b-trapword {
    left: 736px; top: 296px; width: 520px; margin: 0;
    font-weight: 900; font-size: 172px; line-height: 1; color: #F8FAFC; letter-spacing: -6px;
  }
  .b-badge {
    left: 746px; top: 538px; width: 470px; height: 96px;
    background: #EAB308; border-radius: 20px;
    box-shadow: 0 10px 0 #854D0E;
  }
  .b-badge-text {
    left: 746px; top: 538px; width: 470px; height: 96px; margin: 0;
    font-weight: 900; font-size: 54px; line-height: 96px; text-align: center; color: #0F172A;
  }
</style>
</head>
<body>

<!-- ===================== THUMBNAIL A ===================== -->
<div class="slide" id="thumb-a" data-canvas-width="1280" data-canvas-height="720">
  <div class="abs a-glow"></div>

  <svg class="abs a-couch" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- shadow -->
    <ellipse cx="300" cy="378" rx="270" ry="18" fill="#020617" opacity="0.6"/>
    <!-- legs -->
    <rect x="70" y="320" width="26" height="52" rx="6" fill="#1E293B"/>
    <rect x="504" y="320" width="26" height="52" rx="6" fill="#1E293B"/>
    <!-- backrest -->
    <rect x="70" y="80" width="460" height="180" rx="44" fill="#64748B"/>
    <rect x="90" y="98" width="200" height="140" rx="30" fill="#7C8BA1"/>
    <rect x="310" y="98" width="200" height="140" rx="30" fill="#7C8BA1"/>
    <!-- base -->
    <rect x="40" y="280" width="520" height="52" rx="18" fill="#334155"/>
    <!-- seat cushions -->
    <rect x="96" y="214" width="204" height="82" rx="24" fill="#94A3B8"/>
    <rect x="300" y="214" width="204" height="82" rx="24" fill="#94A3B8"/>
    <line x1="300" y1="220" x2="300" y2="292" stroke="#64748B" stroke-width="4"/>
    <!-- arms -->
    <rect x="18" y="164" width="96" height="160" rx="42" fill="#475569"/>
    <rect x="486" y="164" width="96" height="160" rx="42" fill="#475569"/>
    <!-- tag string -->
    <path d="M540 172 C 545 120, 500 70, 470 40" stroke="#F8FAFC" stroke-width="5" fill="none"/>
  </svg>

  <div class="abs a-tag"></div>
  <p class="abs a-tag-text">$1,000</p>

  <div class="abs a-tag-strike"></div>
  <p class="abs a-label">REAL COST:</p>
  <p class="abs a-new">$1,767</p>

  <div class="abs a-pill"></div>
  <p class="abs a-pill-text">6 YEARS?!</p>
</div>

<!-- ===================== THUMBNAIL B ===================== -->
<div class="slide" id="thumb-b" data-canvas-width="1280" data-canvas-height="720">
  <div class="abs b-glow"></div>

  <svg class="abs b-trap" viewBox="0 0 720 473" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4ADE80"/>
        <stop offset="1" stop-color="#15803D"/>
      </linearGradient>
      <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F59E0B"/>
        <stop offset="1" stop-color="#D97706"/>
      </linearGradient>
    </defs>
    <!-- shadow -->
    <ellipse cx="360" cy="452" rx="330" ry="16" fill="#020617" opacity="0.6"/>
    <!-- wooden base: front face + top face -->
    <rect x="40" y="350" width="640" height="86" rx="10" fill="#92400E"/>
    <path d="M70 300 L650 300 L680 352 L40 352 Z" fill="url(#woodTop)"/>
    <!-- wood grain -->
    <path d="M100 326 Q 240 316 380 328 T 640 324" stroke="#B45309" stroke-width="4" fill="none"/>
    <!-- staples -->
    <rect x="150" y="308" width="22" height="10" rx="3" fill="#94A3B8"/>
    <rect x="300" y="308" width="22" height="10" rx="3" fill="#94A3B8"/>
    <!-- spring coil -->
    <circle cx="262" cy="306" r="22" fill="none" stroke="#E2E8F0" stroke-width="8"/>
    <circle cx="292" cy="306" r="22" fill="none" stroke="#CBD5E1" stroke-width="8"/>
    <!-- loaded snap bar pulled back -->
    <path d="M250 300 L110 300 L110 120 L330 120 L330 160" stroke="#E2E8F0" stroke-width="14" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- hold-down bar -->
    <path d="M330 160 L470 250" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round"/>
    <!-- trigger plate -->
    <rect x="420" y="282" width="190" height="26" rx="6" fill="#64748B"/>
    <!-- credit card bait (tilted on the trigger) -->
    <g transform="rotate(-14 515 210)">
      <rect x="400" y="140" width="250" height="158" rx="18" fill="url(#cardGrad)" stroke="#14532D" stroke-width="4"/>
      <rect x="400" y="172" width="250" height="26" fill="#14532D" opacity="0.55"/>
      <rect x="428" y="214" width="46" height="34" rx="6" fill="#EAB308"/>
      <line x1="428" y1="226" x2="474" y2="226" stroke="#A16207" stroke-width="2"/>
      <line x1="428" y1="236" x2="474" y2="236" stroke="#A16207" stroke-width="2"/>
      <circle cx="574" cy="266" r="16" fill="#F8FAFC" opacity="0.85"/>
      <circle cx="600" cy="266" r="16" fill="#EAB308" opacity="0.9"/>
      <rect x="492" y="222" width="130" height="10" rx="5" fill="#DCFCE7" opacity="0.8"/>
    </g>
    <!-- motion/alert marks -->
    <path d="M150 70 L130 30" stroke="#EF4444" stroke-width="10" stroke-linecap="round"/>
    <path d="M200 62 L200 18" stroke="#EF4444" stroke-width="10" stroke-linecap="round"/>
    <path d="M250 70 L270 30" stroke="#EF4444" stroke-width="10" stroke-linecap="round"/>
  </svg>

  <p class="abs b-the">THE</p>
  <p class="abs b-minimum">MINIMUM</p>
  <p class="abs b-trapword">TRAP</p>

  <div class="abs b-badge"></div>
  <p class="abs b-badge-text">$1K = 6 YEARS</p>
</div>

</body>
</html>
