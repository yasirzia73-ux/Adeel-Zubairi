/* ---------- math: missed match ($150/mo from 25 to 65 at 7%) ---------- */
const R = 0.07 / 12, MATCH = [0];
for (let k = 1; k <= 480; k++) MATCH.push(MATCH[k - 1] * (1 + R) + 150);

      <path d="${pts.slice(0, n).map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ')}" stroke="${n > 28 ? RED : GOLD}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    o += ov('BITCOIN <span class="r">&#9660; ~5%</span>', 0, 110, W, 56, WHITE, a6);
  }
  const a7 = fin(T, 'r7');
  if (a7 > 0) {
    g += floorLine() + person('jake', 400, 600, 1.15, { color: GREY, wave: T > C('r7') + 1.5, t: T }) + `<g transform="${scaleAt(820, 360, pop(T, C('r7'), 0.5))}">${phone(820, 360, 1.15, 'ok')}</g>`;
    const s = pop(T, C('r7') + 1.6, 0.4);
    if (s > 0) o += ov('THIS TIME.', 130, 150, 520, 56, GOLD, clamp(s), `transform:rotate(-5deg) scale(${s});border:6px solid #EAB308;border-radius:14px;padding:4px 0;background:rgba(15,23,42,0.9)`);
  }
  return [g, o];
};

S.twist = (T) => {
  let [g, o] = section('THE REAL LESSON', '', T, 'twist', GREEN);
  const a1 = fin(T, 't1') * fout(T, 't2');
  if (a1 > 0) o += ov("THAT'S THE PART<br>WORTH <span class=\"y\">THINKING ABOUT</span>", 0, 230, W, 76, WHITE, a1 * pop(T, C('t1'), 0.45));
  const a2 = fin(T, 't2') * fout(T, 't4');
  if (a2 > 0) {
    g += exchangeB(380, 500, 1.0, a2);
    for (let i = 0; i < 12; i++) g += coin(260 + (i % 6) * 48, 545 - Math.floor(i / 6) * 24, 22, a2 * clamp((T - C('t2') - i * 0.05) / 0.3));
    o += ov('BILLIONS TO<br>COVER THE HOLE', 130, 140, 500, 40, GREEN, a2);
    if (T > C('t3')) {
      g += `<g opacity="${clamp((T - C('t3')) / 0.4) * a2}">${exchangeB(900, 500, 0.62)}${text(900, 300, 'SMALLER EXCHANGE', 24, '#CBD5E1', 800)}</g>`;
      o += ov('?', 820, 320, 160, 100, RED, clamp((T - C('t3') - 0.5) / 0.3) * a2);
    }
  }
  const a4 = fin(T, 't4') * fout(T, 't5');
  if (a4 > 0) {
    const crack = clamp((T - C('t4') - 0.6) / 1.2);
    g += `<g opacity="${a4}" transform="rotate(${-10 * crack} 640 520)">${exchangeB(640, 520, 1.0).replace('BINANCE', 'FTX')}</g>`;
    g += `<path d="M600 250 L630 320 L600 370 L650 440" stroke="${DARK}" stroke-width="8" fill="none" opacity="${a4 * crack}"/>`;
    o += ov('FTX &middot; 2022', 0, 90, W, 50, RED, a4);
    if (T > C('t4') + 2.5) g += badge('CUSTOMERS WAITED 2+ YEARS', 640, 172, GOLD, NAVY, 28, a4 * clamp((T - C('t4') - 2.5) / 0.4));
  }
  const a5 = fin(T, 't5') * fout(T, 't6');
  if (a5 > 0) {
    g += `<g opacity="${a5}">${floorLine()}${person('jake', 320, 600, 1.1, { color: GREY })}${exchangeB(930, 600, 0.9)}</g>`;
    g += flyCoins(T, C('t5'), 380, 480, 860, 420, 4, 1.3, 16, a5, 80);
    o += ov("YOU'RE <span class=\"y\">TRUSTING</span> THE COMPANY", 0, 110, W, 46, WHITE, a5);
  }
  const a6 = fin(T, 't6');
  if (a6 > 0) {
    g += `<g transform="${scaleAt(640, 300, pop(T, C('t6'), 0.5))}">${keyIcon(660, 280, 2.4, GOLD)}</g>`;
    o += ov('NOT YOUR KEYS,<br><span class="y">NOT YOUR COINS.</span>', 0, 410, W, 66, WHITE, a6 * clamp((T - C('t6') - 0.8) / 0.4));
  }
  return [g, o];
};

S.lessons = (T) => {
  let [g, o] = section('5 LESSONS', 'PROTECT YOUR CRYPTO', T, 'lessons', GREEN);
  const items = [['l2', 'Don&rsquo;t keep everything on one exchange'], ['l3', 'Long-term coins? Consider a <span class="y">hardware wallet</span>'],
                 ['l4', 'Beware fake &ldquo;refund&rdquo; emails &amp; support calls'], ['l5', 'Use an <span class="g">authenticator app</span> or passkey, not SMS'],
                 ['l6', 'Only invest what you can <span class="r">afford to lose</span>']];
  items.forEach(([k, s], i) => {
    const a = clamp((T - C(k)) / 0.5); if (!a) return;
    const y = 140 + i * 92, x = 150 + (1 - easeOut(a)) * -60, cur = T >= C(k) && (i === 4 || T < C(items[i + 1][0]));
    g += `<g opacity="${a}"><rect x="${x}" y="${y}" width="980" height="76" rx="18" fill="${cur ? '#1E3A5F' : SLATE}" stroke="${cur ? GOLD : '#334155'}" stroke-width="3"/>
      <circle cx="${x + 42}" cy="${y + 38}" r="26" fill="${GREEN}"/>${text(x + 42, y + 49, i + 1, 30, NAVY)}</g>`;
    o += ov(s, x + 88, y + 20, 880, 32, WHITE, a, 'text-align:left;font-weight:800');
  });
  return [g, o];
};

S.end = (T) => {
  let g = '', o = '';
  if (T < C('e3')) {
    const a1 = fin(T, 'e1') * fout(T, 'e2');
    if (a1 > 0) {
      g += laptop(330, 360, 1.0, 1, a1) + `<g opacity="${a1}"><line x1="520" y1="360" x2="760" y2="360" stroke="${WHITE}" stroke-width="8"/><path d="M752 340 L782 360 L752 380Z" fill="${WHITE}"/></g>`;
      o += ov('$6.3B', 800, 300, 420, 100, RED, a1 * clamp((T - C('e1') - 1.2) / 0.4));
      o += ov('IN ONE NIGHT', 800, 410, 420, 36, WHITE, a1 * clamp((T - C('e1') - 2.2) / 0.4));
    }
    const a2 = fin(T, 'e2');
    if (a2 > 0) {
      const k = ((T - C('e2')) * 0.25) % 1;
      g += `<g opacity="${a2}"><line x1="100" y1="420" x2="1180" y2="420" stroke="#334155" stroke-width="4" stroke-dasharray="12 12"/>${coin(lerp(200, 1100, k) + 120, 400, 20)}
        <g transform="translate(${lerp(200, 1100, k)},380)"><circle r="40" fill="none" stroke="${WHITE}" stroke-width="9"/><line x1="28" y1="28" x2="62" y2="62" stroke="${WHITE}" stroke-width="12" stroke-linecap="round"/></g></g>`;
      o += ov('THE STORY ISN&rsquo;T OVER', 0, 180, W, 60, WHITE, a2 * fout(T, 'e2b'));
      if (T > C('e2b')) o += ov('SEND THIS TO A FRIEND<br>WHO KEEPS CRYPTO ON AN EXCHANGE', 0, 160, W, 44, GOLD, clamp((T - C('e2b')) / 0.4));
    }
    return [g, o];
  }
  const a = fin(T, 'e3', 0.6);
  g += `<g opacity="${a}" transform="translate(640,150) scale(1.1)"><path d="M0 60 C -38 18 -48 -2 -48 -22 A48 48 0 1 1 48 -22 C 48 -2 38 18 0 60Z" fill="${GOLD}"/><circle cx="0" cy="-22" r="31" fill="${NAVY}"/>${text(0, -6, '$', 46, GOLD)}</g>`;
  o += ov('THE MONEY <span class="y">MAP</span>', 0, 230, W, 44, WHITE, a);
  g += `<g opacity="${a}"><rect x="500" y="300" width="280" height="70" rx="14" fill="${RED}"/>${text(640, 347, 'SUBSCRIBE', 34, WHITE)}</g>`;
  g += `<g opacity="${a}"><rect x="140" y="410" width="460" height="230" rx="18" fill="#1E293B" stroke="#334155" stroke-width="3" stroke-dasharray="10 10"/>
        <rect x="680" y="410" width="460" height="230" rx="18" fill="#1E293B" stroke="#334155" stroke-width="3" stroke-dasharray="10 10"/></g>`;
  o += ov('WATCH NEXT:<br><span class="y">Two Friends<br>Earn $60K</span>', 140, 465, 460, 34, WHITE, a);
  o += ov('WATCH:<br><span class="g">401(k) Explained</span>', 680, 485, 460, 34, WHITE, a);
  return [g, o];
};

/* ---------- frame renderer ---------- */
function captionHTML(T) {
  for (const k in CUE) {
    const c = CUE[k];
    if (T >= c.start - 0.05 && T <= c.end + 0.3) {
      const s = c.text.replace(/(401\(k\)|\$[\d,]+(?:\.\d+)?|\d+%|\b\d{2,}\b)/g, '<span class="hl">$1</span>');
      return `<div class="cap"><span class="box">${s}</span></div>`;
    }
  }
  return '';
}

const TITLES = { jake: 'JAKE&rsquo;S <span class="hl">MORNING</span>', basics: 'HOT WALLETS <span style="color:#94A3B8">vs</span> <span style="color:#93C5FD">COLD WALLETS</span>',
  heist: 'THE <span style="color:#EF4444">HEIST</span>', who: 'WHO <span style="color:#EF4444">DID IT?</span>', freeze: 'THE <span style="color:#93C5FD">CHASE</span>',
  response: 'BINANCE&rsquo;S <span class="hl">RESPONSE</span>', twist: 'THE REAL <span style="color:#22C55E">LESSON</span>', lessons: '5 WAYS TO PROTECT<br><span style="color:#22C55E">YOUR CRYPTO</span>' };
const FIRST = {}; for (const [sc, key] of CUES) if (!(sc in FIRST)) FIRST[sc] = key;
function sectionCard(T) {
  for (const sc in TITLES) {
    const a = SCENES[sc].start + 0.05, b = C(FIRST[sc]) - 0.05;
    if (T < a || T > b + 0.3 || b - a < 0.6) continue;
    const op = Math.min(clamp((T - a) / 0.25), clamp((b + 0.3 - T) / 0.3)), s2 = 0.85 + 0.15 * easeOut((T - a) / 0.4);
    return `<div style="position:absolute;inset:0;background:rgba(11,16,32,0.95);opacity:${op}"></div>` +
      ov(TITLES[sc], 0, 280, W, 72, WHITE, op, `transform:scale(${s2});text-shadow:0 6px 0 #020617`);
  }
  return '';
}
window.render = function (T) {
  let svg = '', html = '';
  for (const name of ORDER) {
    const sc = SCENES[name];
    if (T < sc.start - 0.01 || T > sc.end + 0.01) continue;
    const fade = Math.min(1, (T - sc.start) / 0.45, (sc.end - T) / 0.45);
    if (fade <= 0) continue;
    const [g, o] = S[name](T);
    svg += `<g opacity="${fade.toFixed(3)}">${g}</g>`;
    html += `<div style="opacity:${fade.toFixed(3)}">${o}</div>`;
  }
  const disc = T < C('e2') ? 'Based on news reports as of Nov 2, 2026 &middot; Details still developing &middot; Not financial advice' : '';
  const bg = `<rect width="${W}" height="${H}" fill="${NAVY}"/><circle cx="640" cy="320" r="620" fill="#1E293B" opacity="0.35"/>`;
  html += sectionCard(T);
  document.getElementById('stage').innerHTML =
    `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bg}${svg}</svg>` + html +
    (disc ? `<div class="ov" style="left:20px;top:8px;font-size:15px;font-weight:800;color:#64748B;text-align:left">${disc}</div>` : '') +
    captionHTML(T);
};
window.CUE_LIST = () => Object.entries(CUE).map(([k, c]) => ({ key: k, start: c.start, end: c.end, text: c.text }));
window.render(0);
</script>
