<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>GTA 6 Per Second</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; font-family: "Montserrat", sans-serif; color: #fff; }
  .shade { position: absolute; left: 0; right: 0; }
  .t { position: absolute; left: 0; width: 720px; text-align: center; font-weight: 900; line-height: 1.05; white-space: nowrap;
       text-shadow: 0 0 2px #000, 0 4px 0 #000, 3px 3px 0 #000, -3px 3px 0 #000, 3px -3px 0 #000, -3px -3px 0 #000, 0 10px 24px rgba(0,0,0,.6); }
  .num { position: absolute; left: 0; width: 720px; text-align: center; font-weight: 900; white-space: nowrap; }
  .num span { background: linear-gradient(180deg, #DCFCE7, #22C55E); -webkit-background-clip: text; background-clip: text; color: transparent;
              filter: drop-shadow(0 6px 0 #14532D) drop-shadow(0 0 3px #000) drop-shadow(0 12px 20px rgba(0,0,0,.6)); }
  .num.gold span { background: linear-gradient(180deg, #FEF3C7, #EAB308); filter: drop-shadow(0 6px 0 #854D0E) drop-shadow(0 0 3px #000) drop-shadow(0 12px 20px rgba(0,0,0,.6)); -webkit-background-clip: text; background-clip: text; }
  .chip { position: absolute; left: 50%; font-weight: 900; padding: 10px 24px; border-radius: 999px; white-space: nowrap; box-shadow: 0 6px 0 rgba(0,0,0,.4), 0 14px 26px rgba(0,0,0,.45); }
  .panel { position: absolute; left: 0; right: 0; top: 1040px; height: 240px; background: linear-gradient(180deg, rgba(5,7,13,0) 0%, rgba(5,7,13,.92) 22%, rgba(5,7,13,.97) 100%); }
  .pl { position: absolute; left: 0; width: 720px; top: 1086px; text-align: center; font-weight: 900; font-size: 22px; color: #FACC15; letter-spacing: .5px; }
  .pv { position: absolute; left: 0; width: 720px; top: 1114px; text-align: center; font-weight: 900; font-size: 60px; color: #4ADE80; text-shadow: 0 0 18px rgba(74,222,128,.45); font-variant-numeric: tabular-nums; }
  .pd { position: absolute; left: 0; width: 720px; top: 1192px; text-align: center; font-weight: 700; font-size: 13px; color: rgba(248,250,252,.6); }
  .brand { position: absolute; left: 0; width: 720px; top: 40px; text-align: center; font-weight: 900; font-size: 20px; letter-spacing: 3px; text-shadow: 0 2px 6px #000; }
  .fan { position: absolute; left: 0; width: 720px; top: 72px; text-align: center; font-weight: 800; font-size: 14px; color: rgba(255,255,255,.75); text-shadow: 0 1px 4px #000; }
  .prog { position: absolute; left: 0; top: 0; height: 8px; background: linear-gradient(90deg, #22C55E, #FACC15); }
</style></head>
<body><div id="stage"></div>
<script>
const TOTAL = 32.5, RATE = 3.79e9 / 86400;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (T, t0, d = 0.35) => { const x = (T - t0) / d; return x <= 0 ? 0 : easeBack(x); };
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
// scene windows [start, end]
const SC = [[0, 4.5], [4.5, 9], [9, 13.5], [13.5, 18], [18, 22.5], [22.5, 27], [27, 33]];
function vis(T, k) { const [a, b] = SC[k]; if (T < a - 0.05 || T > b + 0.05) return 0; return clamp(Math.min((T - a + 0.05) / 0.15, (b + 0.05 - T) / 0.15)); }
const txt = (s, y, size, op, sc = 1, col = '#fff') => op <= 0 ? '' : `<div class="t" style="top:${y}px;font-size:${size}px;color:${col};opacity:${op};transform:scale(${sc})">${s}</div>`;
const num = (s, y, size, op, sc = 1, gold = false) => op <= 0 ? '' : `<div class="num${gold ? ' gold' : ''}" style="top:${y}px;font-size:${size}px;opacity:${op};transform:scale(${sc})"><span>${s}</span></div>`;
const chip = (s, y, bg, fg, size, op, sc = 1, rot = 0) => op <= 0 ? '' : `<div class="chip" style="top:${y}px;background:${bg};color:${fg};font-size:${size}px;opacity:${op};transform:translateX(-50%) rotate(${rot}deg) scale(${sc})">${s}</div>`;
function frame(T) {
  let o = '';
  // shading behind the text block for readability
  o += `<div class="shade" style="top:200px;height:620px;background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 70%)"></div>`;
  let v = vis(T, 0); if (v) { const s1 = pop(T, 0.05), n = 43865 * easeOut((T - 0.3) / 1.2), s3 = pop(T, 1.6);
    o += txt('GTA 6 MADE', 300, 62, v * clamp(s1), s1) + num(fmt(n), 390, 128, v * clamp(pop(T, 0.25)), 1) + txt('EVERY. SECOND. 🤯', 560, 60, v * clamp(s3), s3 * (1 + 0.03 * Math.sin(T * 9)), '#FACC15'); }
  v = vis(T, 1); if (v) { const t0 = SC[1][0], n = 3.79 * easeOut((T - t0 - 0.25) / 1.1);
    o += txt('ON DAY ONE IT SOLD', 310, 50, v * clamp(pop(T, t0)), pop(T, t0)) + num('$' + n.toFixed(2) + 'B', 390, 140, v) + chip('🏆 RECORD · REPORTED BY TAKE-TWO', 600, '#0B0B0B', '#FACC15', 24, v * clamp(pop(T, t0 + 1.2)), pop(T, t0 + 1.2), -2); }
  v = vis(T, 2); if (v) { const t0 = SC[2][0];
    o += txt('$3.79 BILLION', 300, 64, v * clamp(pop(T, t0)), pop(T, t0)) + txt('÷ 24 HOURS', 390, 64, v * clamp(pop(T, t0 + 0.5)), pop(T, t0 + 0.5), '#22D3EE') +
      txt('÷ 60 MIN ÷ 60 SEC', 480, 52, v * clamp(pop(T, t0 + 1.0)), pop(T, t0 + 1.0), '#22D3EE') + num('= $43,865/SEC', 580, 76, v * clamp(pop(T, t0 + 1.6)), pop(T, t0 + 1.6), true); }
  v = vis(T, 3); if (v) { const t0 = SC[3][0], n = 2.63 * easeOut((T - t0 - 0.2) / 1.2);
    o += txt("THAT'S", 320, 54, v * clamp(pop(T, t0)), pop(T, t0)) + num('$' + n.toFixed(1) + ' MILLION', 410, 82, v) + txt('EVERY MINUTE ⏱️', 560, 64, v * clamp(pop(T, t0 + 1.3)), pop(T, t0 + 1.3), '#FACC15'); }
  v = vis(T, 4); if (v) { const t0 = SC[4][0], n = 158 * easeOut((T - t0 - 0.2) / 1.2);
    o += txt('AND', 320, 54, v * clamp(pop(T, t0)), pop(T, t0)) + num('$' + Math.round(n) + ' MILLION', 410, 82, v) + txt('EVERY HOUR 🕐', 560, 64, v * clamp(pop(T, t0 + 1.3)), pop(T, t0 + 1.3), '#FACC15'); }
  v = vis(T, 5); if (v) { const t0 = SC[5][0];
    o += txt('THAT’S ALMOST', 300, 56, v * clamp(pop(T, t0)), pop(T, t0)) + txt('A BRAND-NEW CAR 🚗', 390, 56, v * clamp(pop(T, t0 + 0.5)), pop(T, t0 + 0.5), '#4ADE80') +
      txt('EVERY SECOND', 490, 70, v * clamp(pop(T, t0 + 1.1)), pop(T, t0 + 1.1)) + chip('FOR 24 HOURS STRAIGHT', 620, '#EC4899', '#fff', 30, v * clamp(pop(T, t0 + 2)), pop(T, t0 + 2), 2); }
  v = vis(T, 6); if (v) { const t0 = SC[6][0];
    o += txt('WHILE YOU WATCHED THIS…', 320, 42, v * clamp(pop(T, t0)), pop(T, t0)) + num(fmt(RATE * T), 410, 104, v * clamp(pop(T, t0 + 0.3)), pop(T, t0 + 0.3)) +
      chip('🔔 FOLLOW FOR MORE MONEY FACTS', 600, '#DC2626', '#fff', 28, v * clamp(pop(T, t0 + 1.4)), pop(T, t0 + 1.4) * (1 + 0.04 * Math.sin(T * 7))); }
  // persistent elements
  o += `<div class="prog" style="width:${clamp(T / TOTAL) * 720}px"></div><div class="brand">THE MONEY <span style="color:#FACC15">MAP</span></div><div class="fan">🎮 Fan-made GTA 6-style clips · not official gameplay</div>`;
  o += `<div class="panel"></div><div class="pl">💰 GTA 6 MADE THIS WHILE YOU WATCHED:</div><div class="pv">${fmt(RATE * T)}</div><div class="pd">Average day-one rate from Take-Two's reported $3.79B · not financial advice</div>`;
  document.getElementById('stage').innerHTML = o;
}
window.READY = false; window.TOTAL = TOTAL;
document.fonts.ready.then(() => { frame(1); window.READY = true; });
window.render = frame;
</script>
</body></html>
