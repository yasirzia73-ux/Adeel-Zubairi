/* timing: ~2.45 spoken words/sec; numbers count as ~3 spoken words */
function spokenWords(s) {
  return s.split(/\s+/).filter(Boolean).reduce((n, w) => n + (/\d/.test(w) ? 3 : 1), 0);
}
const CUE = {}; const SCENES = {}; const ORDER = [];
(function buildTimeline() {
  let t = 0.4, prevScene = null;
  for (const [scene, key, text] of CUES) {
    if (scene !== prevScene) {
      if (prevScene) { SCENES[prevScene].end = t + 0.5; t += 0.9; }
      SCENES[scene] = { start: t - 0.2 }; ORDER.push(scene); prevScene = scene;
    }
    const d = Math.max(1.9, spokenWords(text) / 2.45);
    CUE[key] = { start: t, end: t + d, text };
    t += d + 0.35;
  }
  SCENES[prevScene].end = t + 15;          // 15 s end-screen hold
  window.TOTAL = SCENES[prevScene].end;
})();
const C = k => CUE[k].start, E = k => CUE[k].end, D = k => CUE[k].end - CUE[k].start;

/* ---------- helpers ---------- */
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const P = (t, a, d) => ease((t - a) / d);
const lerp = (a, b, p) => a + (b - a) * p;
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const pop = (t, a, d=0.45) => { const x = clamp((t - a) / d); return x === 0 ? 0 : 1 + 0.25*Math.sin(x*Math.PI) * (1 - x) + (easeOut(x) - 1); };
const fin = (T, k, d=0.4) => clamp((T - C(k)) / d);             // fade-in at cue k
const fout = (T, k, d=0.4) => 1 - clamp((T - C(k)) / d);        // fade-out at cue k
const scaleAt = (cx, cy, s) => `translate(${cx},${cy}) scale(${s}) translate(${-cx},${-cy})`;

function text(x, y, s, size, color=WHITE, weight=900, anchor='middle', extra='') {

}

}

}

  if (maya) {
    for (const [cx, cy, r] of [[-30,-244,16],[-17,-259,16],[0,-265,17],[17,-259,16],[30,-244,16],[-37,-222,13],[37,-222,13]])

  } else {
    g += `<path d="M-37 -230 Q -36 -272 0 -268 Q 36 -272 37 -230 Q 22 -250 0 -248 Q -22 -250 -37 -230Z" fill="${hair}"/>`;
  }
  g += `<circle cx="-12" cy="-224" r="4.5" fill="${NAVY}"/><circle cx="12" cy="-224" r="4.5" fill="${NAVY}"/>`;
  g += o.sad ? `<path d="M-11 -204 Q 0 -212 11 -204" stroke="${NAVY}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`
             : `<path d="M-12 -209 Q 0 -198 12 -209" stroke="${NAVY}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  if (o.party) g += `<path d="M-14 -258 L0 -312 L14 -258Z" fill="${GOLD}"/><circle cx="0" cy="-314" r="7" fill="${RED}"/>`;
  return g + '</g>';
}
function coin(x, y, r=13, op=1) {

/* ---------- math: missed match ($150/mo from 25 to 65 at 7%) ---------- */

const matchAt = age => { const m = clamp((age - 25) * 12, 0, 480), i = Math.floor(m), f = m - i; return i >= 480 ? MATCH[480] : MATCH[i] * (1 - f) + MATCH[i + 1] * f; };

function tanker(x, y, s, op=1) {

function straitMap(op=1, closed=0) {

    <path d="M140 130 L1140 130 L1140 300 Q980 330 860 290 Q760 255 700 300 Q640 345 520 300 Q380 250 260 280 Q190 300 140 280Z" fill="${LAND}"/>
    <path d="M140 570 L140 470 Q260 430 420 455 Q560 480 640 410 Q700 360 760 405 Q860 480 1000 440 Q1080 420 1140 450 L1140 570Z" fill="${SAND}"/>
    ${text(820, 200, 'IRAN', 40, '#FDE68A')}${text(420, 540, 'ARABIAN PENINSULA', 26, '#78350F')}
    ${text(660, 376, 'STRAIT OF HORMUZ', 22, '#BFDBFE', 900)}`;
  if (closed > 0) g += `<g opacity="${closed}"><line x1="700" y1="300" x2="700" y2="400" stroke="${RED}" stroke-width="14" stroke-dasharray="18 12"/>${cross(700, 350, 34, RED, 12)}</g>`;

function gasPump(cx, by, s, price='$2.99', col=GREEN, op=1) {

function truck(x, by, s, op=1) {

function house(cx, by, s, op=1, snow=0) {
  let g = `<g transform="translate(${cx},${by}) scale(${s})" opacity="${op}"><rect x="-120" y="-150" width="240" height="150" rx="6" fill="#CBD5E1"/>

function upArrow(x, y, s, col=RED) { return `<g transform="translate(${x},${y}) scale(${s})"><path d="M0 -40 L30 0 L12 0 L12 40 L-12 40 L-12 0 L-30 0Z" fill="${col}"/></g>`; }
function ccard(x, y, s, op=1) {

}
function car(x, by, s, op=1) {

const flyCoins = (T, t0, x0, y0, x1, y1, n, period=0.9, r=14, op=1, arc=80) => {
  let g = ''; if (T < t0) return g;
  for (let i = 0; i < n; i++) { const k = ((T - t0) / period + i / n) % 1; g += coin(lerp(x0, x1, k), lerp(y0, y1, k) - Math.sin(Math.PI * k) * arc, r, op * Math.min(1, (1 - k) * 4, k * 6)); }
  return g;
};
const stampO = (txt, x, y, w, size, color, s, rot=-8) => s > 0 ? ov(txt, x, y, w, size, color, clamp(s),
  `transform:rotate(${rot}deg) scale(${s});border:6px solid ${color};border-radius:14px;padding:6px 0;background:rgba(15,23,42,0.88)`) : '';
function priceChart(T, t0, dur, op, upto=1) {
  // Brent-like path: $72 (Feb) -> ~$120 (Mar peak) -> ~$90s -> ~$100 (Nov)
  const pts = [[0, 72], [0.06, 85], [0.12, 112], [0.16, 119], [0.22, 104], [0.3, 95], [0.38, 99], [0.46, 92], [0.55, 88], [0.65, 94], [0.75, 90], [0.88, 104], [1, 100]];
  const X = f => 220 + f * 840, Y = v => 560 - (v - 60) / 70 * 400;
  const p = clamp((T - t0) / dur) * upto;
  let d = '', last = pts[0];
  for (let i = 0; i < pts.length; i++) { const [f, v] = pts[i]; if (f > p) { const [f0, v0] = pts[i - 1]; const v1 = v0 + (v - v0) * (p - f0) / (f - f0); d += ` L${X(p)} ${Y(v1)}`; last = [p, v1]; break; } d += (i ? ' L' : 'M') + X(f) + ' ' + Y(v); last = [f, v]; }
  let g = `<g opacity="${op}">`;
  for (const v of [60, 80, 100, 120]) g += `<line x1="220" y1="${Y(v)}" x2="1060" y2="${Y(v)}" stroke="#334155" stroke-width="2" stroke-dasharray="${v === 60 ? '' : '6 8'}"/>${text(205, Y(v) + 7, '$' + v, 20, '#94A3B8', 800, 'end')}`;
  for (const [f, m] of [[0, 'FEB'], [0.2, 'APR'], [0.45, 'JUN'], [0.7, 'AUG'], [0.95, 'OCT']]) g += text(X(f), 595, m, 20, '#94A3B8', 800);
  g += `<path d="${d}" stroke="${ORANGE}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(last[0])}" cy="${Y(last[1])}" r="11" fill="${ORANGE}" stroke="${NAVY}" stroke-width="3"/>`;
  return [g + '</g>', last[1]];
}

    fed += `<path d="M-200 -216 L0 -300 L200 -216Z" fill="#94A3B8"/>${text(0, -236, 'THE FED', 28, NAVY)}</g>`;
    g += fed + `<g opacity="${a3}" transform="${scaleAt(900, 330, pop(T, C('i3') + 1.2, 0.45))}">${upArrow(900, 330, 2.0)}${text(900, 460, 'RATES', 34, RED)}</g>`;
  }
  const a4 = fin(T, 'i4') * fout(T, 'i6');
  if (a4 > 0) {
    g += house(330, 560, 1.0, a4);
    const r = T < C('i4') + 2.2 ? 5.98 : lerp(5.98, 7.24, clamp((T - C('i4') - 2.2) / 1.0));
    o += ov(r.toFixed(2) + '%', 560, 170, 600, 110, r > 6.5 ? RED : GREEN, a4, 'text-align:left');
    o += ov('30-YEAR MORTGAGE RATE', 560, 300, 600, 28, '#CBD5E1', a4, 'text-align:left;letter-spacing:2px');
    if (T > C('i5')) {
      o += ov('$350K LOAN: <span style="color:#94A3B8">$2,094</span> &rarr; <span class="r">$2,385</span>/mo', 560, 380, 700, 34, WHITE, clamp((T - C('i5')) / 0.4), 'text-align:left');
      g += `<g transform="${scaleAt(800, 500, pop(T, C('i5') + 1.5, 0.45))}">${badge('+$291/MONTH', 800, 510, RED, WHITE, 36)}</g>`;
    }
  }
  const a6 = fin(T, 'i6');
  if (a6 > 0) {
    g += `<g opacity="${a6}">${ccard(330, 300, 1.2)}${upArrow(480, 220, 0.8)}${car(900, 360, 1.1)}${upArrow(1060, 220, 0.8)}</g>`;
    const w = 900 * 540 / 2000 * easeOut(clamp((T - C('i6') - 1.5) / 1.0));
    g += `<g opacity="${a6}"><rect x="190" y="470" width="900" height="70" rx="16" fill="${SLATE}" stroke="#334155" stroke-width="3"/><rect x="196" y="476" width="${w}" height="58" rx="12" fill="#60A5FA"/></g>`;
    o += ov('~$540 <span style="font-size:28px;color:#CBD5E1">HIGHER RATES</span>', 520, 470, 600, 50, '#60A5FA', a6 * clamp((T - C('i6') - 2.2) / 0.4), 'text-align:left');

  return [g, o];
};

S.bill = (T) => {
  let [g, o] = section('THE BILL', 'THE $2,000 BILL (ESTIMATE)', T, 'bill', RED);
  const parts = [['b2', 1100, ORANGE, 'ENERGY'], ['b3', 540, '#60A5FA', 'HIGHER RATES'], ['b4', 360, '#94A3B8', 'MILITARY COST SHARE']];
  let x = 140; const scale = 1000 / 2000;
  parts.forEach(([k, v, col, n]) => {
    const p = easeOut(clamp((T - C(k) - 0.2) / 0.8)); if (p <= 0) { x += v * scale; return; }
    const w = v * scale * p;
    g += `<rect x="${x}" y="270" width="${w}" height="140" rx="10" fill="${col}"/>`;
    if (p > 0.6) { g += text(x + v * scale / 2, 355, '$' + v.toLocaleString(), 40, NAVY); g += text(x + v * scale / 2, 450, n, 20, col, 900); }
    x += v * scale;
  });
  g += `<rect x="140" y="270" width="1000" height="140" rx="10" fill="none" stroke="#475569" stroke-width="4"/>`;
  if (T > C('b5')) {
    const c = 2000 * easeOut(clamp((T - C('b5')) / 1.0));
    o += ov('&asymp; ' + money(c) + ' PER HOUSEHOLD', 0, 130, W, 60, WHITE, clamp((T - C('b5')) / 0.3));
    g += badge('~$265 BILLION NATIONWIDE', 640, 540, RED, WHITE, 30, clamp((T - C('b5') - 2.2) / 0.4));
  }
  return [g, o];
};

    o += ov('RENTS +<br>WORKS FROM HOME<br><span class="g">PAYS LESS</span>', 720, 120, 520, 30, WHITE, a3 * clamp((T - C('c3') - 2.4) / 0.4));

  return [g, o];
};

S.next = (T) => {
  let [g, o] = section("WHAT'S NEXT", '3 POSSIBLE PATHS', T, 'next', GOLD);

    const op = T < C('x3') ? 1 : fin(T, 'x4');
    g += `<g opacity="${op}"><circle cx="200" cy="380" r="22" fill="${WHITE}"/>`;
    paths.forEach(([k, n, col], i) => { const y = 220 + i * 160, lit = T > C(k);
      g += `<path d="M222 380 C 420 380 420 ${y} 640 ${y} L1000 ${y}" stroke="${lit ? col : '#475569'}" stroke-width="${lit ? 14 : 8}" fill="none" stroke-dasharray="${lit ? '' : '14 12'}"/>`;
      g += `<rect x="1010" y="${y - 40}" width="220" height="80" rx="16" fill="${lit ? col : SLATE}" stroke="${col}" stroke-width="4"/>${text(1120, y + 10, n, 26, lit ? NAVY : col)}`; });
    g += '</g>';
    if (T > C('x4')) o += ov('+$50/WEEK KEEPS ADDING UP', 300, 290, 640, 30, GOLD, clamp((T - C('x4')) / 0.4) * fout(T, 'x5'));

    const k = clamp((T - C('x3') - 0.5) / 4);

    g += `<g opacity="${a3}" transform="translate(${1080 + 40 * Math.sin(T * 2)},${200 + 300 * k}) rotate(${30 * Math.sin(T * 2)})"><path d="M0 -60 Q40 -20 0 60 Q-40 -20 0 -60Z" fill="#F8FAFC" opacity="0.9"/><line x1="0" y1="-60" x2="0" y2="70" stroke="#94A3B8" stroke-width="3"/></g>`;
    g += text(560, 300, 'UP FAST', 30, RED, 900, 'middle', `opacity="${a3}"`) + text(1080, 300, 'DOWN SLOWLY', 30, GREEN, 900, 'middle', `opacity="${a3}"`);
    o += ov('ROCKETS &amp; <span style="color:#CBD5E1">FEATHERS</span>', 0, 110, W, 56, ORANGE, a3);
  }
  const a6 = fin(T, 'x6');
  if (a6 > 0) o += ov('GET YOUR BUDGET READY<br>FOR <span class="y">ALL THREE</span>', 0, 240, W, 64, WHITE, a6, 'background:rgba(15,23,42,0.92);padding:30px 0');

S.protect = (T) => {
  let [g, o] = section('5 MOVES', 'KEEP MORE OF YOUR MONEY', T, 'protect', GREEN);
  const items = [['m2', 'Cut your <span class="y">gas bill</span>: compare prices, check tires, slow down'],
                 ['m3', 'Get ahead of winter: <span class="y">thermostat</span> back 7&ndash;10&deg; = up to 10% saved'],

    const a = clamp((T - C(k)) / 0.5); if (!a) return;
    const y = 128 + i * 82, x = 110 + (1 - easeOut(a)) * -60, cur = T >= C(k) && (i === 4 || T < C(items[i + 1][0]));
    g += `<g opacity="${a}"><rect x="${x}" y="${y}" width="1060" height="70" rx="18" fill="${cur ? '#1E3A5F' : SLATE}" stroke="${cur ? GOLD : '#334155'}" stroke-width="3"/>
      <circle cx="${x + 42}" cy="${y + 35}" r="24" fill="${GREEN}"/>${text(x + 42, y + 45, i + 1, 28, NAVY)}</g>`;
    o += ov(s, x + 88, y + 19, 960, 28, WHITE, a, 'text-align:left;font-weight:800');

  return [g, o];
};

S.end = (T) => {
  let g = '', o = '';

    const a1 = fin(T, 'e1') * fout(T, 'e2');

      o += ov('A WAR FAR AWAY.<br><span class="r">A HIT TO EVERY WALLET.</span>', 0, 110, W, 50, WHITE, a1); }
    const a2 = fin(T, 'e2');
    if (a2 > 0) o += ov("YOU CAN'T CONTROL OIL PRICES.<br><span class=\"g\">YOU CAN CONTROL YOUR BUDGET.</span>", 0, 250, W, 52, WHITE, a2 * pop(T, C('e2'), 0.5));
    return [g, o];
  }
  const a = fin(T, 'e3', 0.6);
  g += `<g opacity="${a}" transform="translate(640,150) scale(1.1)"><path d="M0 60 C -38 18 -48 -2 -48 -22 A48 48 0 1 1 48 -22 C 48 -2 38 18 0 60Z" fill="${GOLD}"/><circle cx="0" cy="-22" r="31" fill="${NAVY}"/>${text(0, -6, '$', 46, GOLD)}</g>`;
  o += ov('THE MONEY <span class="y">MAP</span>', 0, 230, W, 44, WHITE, a);

  g += `<g opacity="${a}"><rect x="140" y="410" width="460" height="230" rx="18" fill="#1E293B" stroke="#334155" stroke-width="3" stroke-dasharray="10 10"/>
        <rect x="680" y="410" width="460" height="230" rx="18" fill="#1E293B" stroke="#334155" stroke-width="3" stroke-dasharray="10 10"/></g>`;
  o += ov('WATCH NEXT:<br><span class="r">The $6.3B<br>Binance Hack</span>', 140, 465, 460, 34, WHITE, a);
  o += ov('WATCH:<br><span class="g">5 Money Moves<br>Before Dec 31</span>', 680, 465, 460, 34, WHITE, a);
  return [g, o];
};

/* ---------- frame renderer ---------- */
function captionHTML(T) {
  for (const k in CUE) {
    const c = CUE[k];
    if (T >= c.start - 0.05 && T <= c.end + 0.3) {
      const s = c.text.replace(/(401\(k\)|\$[\d,]+(?:\.\d+)?|\d+%|\b\d{2,}\b)/g, '<span class="hl">$1</span>');
      return `<div class="cap"><span class="box">${s}</span></div>`;
    }
  }
  return '';
}

window.render = function (T) {
  let svg = '', html = '';
  for (const name of ORDER) {
    const sc = SCENES[name];
    if (T < sc.start - 0.01 || T > sc.end + 0.01) continue;
    const fade = Math.min(1, (T - sc.start) / 0.45, (sc.end - T) / 0.45);
    if (fade <= 0) continue;
    const [g, o] = S[name](T);
    svg += `<g opacity="${fade.toFixed(3)}">${g}</g>`;
    html += `<div style="opacity:${fade.toFixed(3)}">${o}</div>`;
  }
  const disc = T < C('e2') ? 'Estimates &amp; news reports as of Nov 3, 2026 &middot; Not financial advice' : '';
  const bg = `<rect width="${W}" height="${H}" fill="${NAVY}"/><circle cx="640" cy="320" r="620" fill="#1E293B" opacity="0.35"/>`;
  document.getElementById('stage').innerHTML =
    `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bg}${svg}</svg>` + html +
    (disc ? `<div class="ov" style="left:20px;top:8px;font-size:15px;font-weight:800;color:#64748B;text-align:left">${disc}</div>` : '') +
    captionHTML(T);
};
window.CUE_LIST = () => Object.entries(CUE).map(([k, c]) => ({ key: k, start: c.start, end: c.end, text: c.text }));
window.render(0);
</script>
