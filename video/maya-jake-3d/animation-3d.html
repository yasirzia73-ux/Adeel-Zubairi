}

const CX = a => -5 + (a - 22) / 43 * 10;
function makeChart(series, ymax) {
  const g = new THREE.Group(), CY = v => v / ymax * 4.2;
  const back = new THREE.Mesh(new THREE.PlaneGeometry(11.6, 5.2), std(0x0B1226, 0.9, 0, { transparent: true, opacity: 0.55 }));
  back.position.set(0, 2.5, -1.3); back.receiveShadow = true; g.add(back);
  const lineM = new THREE.LineBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.8 });
  const gridVals = ymax > 1e6 ? [0, 500000, 1000000] : [0, 250000, 500000, 750000];
  for (const v of gridVals) { const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-5.6, CY(v), -1.28), new THREE.Vector3(5.6, CY(v), -1.28)]); g.add(new THREE.Line(geo, lineM)); }
  for (const a of [22, 32, 45, 55, 65]) { const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(CX(a), 0, -1.28), new THREE.Vector3(CX(a), 4.9, -1.28)]); g.add(new THREE.Line(geo, lineM)); }
  const out = { group: g, CY, gridVals, items: [] };
  for (const s of series) {
    const plane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), -5);
    const pts = [], from = s.from || 22;
    for (let a = from; a <= 65.001; a += 0.25) pts.push(new THREE.Vector3(CX(a), CY(balAt(s.data, a)), s.z));
    const shape = new THREE.Shape(); shape.moveTo(CX(from), 0); pts.forEach(p => shape.lineTo(p.x, p.y)); shape.lineTo(CX(65), 0); shape.closePath();
    const wall = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.34, bevelEnabled: false, curveSegments: 1 }),
      std(s.color, 0.35, 0.1, { transparent: true, opacity: s.faint ? 0.18 : 0.5, emissive: s.color, emissiveIntensity: 0.18, clippingPlanes: [plane], side: THREE.DoubleSide, depthWrite: false }));
    wall.position.z = s.z - 0.17; g.add(wall);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 700, 0.06, 10),
      std(s.color, 0.3, 0.2, { emissive: s.color, emissiveIntensity: s.faint ? 0.3 : 1.3, clippingPlanes: [plane], transparent: !!s.faint, opacity: s.faint ? 0.4 : 1 }));
    tube.position.z = 0.17; tube.castShadow = true; g.add(tube);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 16), std(s.color, 0.2, 0.2, { emissive: s.color, emissiveIntensity: 2.2 }));
    g.add(head); head.visible = !s.faint;
    out.items.push({ s, plane, head, from });
  }
  const cursor = new THREE.Mesh(new THREE.BoxGeometry(0.03, 4.9, 0.03), std(0xffffff, 0.5, 0, { emissive: 0xffffff, emissiveIntensity: 0.6, transparent: true, opacity: 0.35 }));
  cursor.position.y = 2.45; g.add(cursor); out.cursor = cursor;
  out.update = (age) => {
    for (const it of out.items) {
      const end = Math.max(it.from, Math.min(65, age)); it.plane.constant = CX(end) + 0.001;
      const v = balAt(it.s.data, end); it.head.position.set(CX(end), CY(v), it.s.z + 0.17);
      it.head.visible = !it.s.faint && age > it.from + 0.05; it.head.scale.setScalar(1 + 0.15 * Math.sin(age * 9));
    }
    cursor.position.x = CX(Math.min(65, age));
  };
  return out;
}

function scr(x, y, z) { v3.set(x, y, z).project(camera); return [(v3.x + 1) / 2 * W, (1 - v3.y) / 2 * H]; }
function lbl(x, y, z, html, style = '', dy = 0) { const [sx, sy] = scr(x, y, z); return `<div class="lbl" style="left:${sx.toFixed(1)}px;top:${(sy + dy).toFixed(1)}px;${style}">${html}</div>`; }
function ov(html, x, y, w, size, cls = 'w3', op = 1, extra = '') {

function pill(s, bg, fg, size = 24) { return `<span class="pill" style="background:${bg};color:${fg};font-size:${size}px">${s}</span>`; }

function setCam(px, py, pz, lx, ly, lz) { camera.position.set(px, py, pz); camera.lookAt(lx, ly, lz); camera.updateMatrixWorld(); }

      <div class="s3" style="font-size:31px;font-weight:800;line-height:1.3;margin-top:22px">Real returns vary. Nothing is guaranteed.<br>Not financial advice.</div></div>`;

    burst.count = k; burst.instanceMatrix.needsUpdate = true;

};

S.bonus = (T) => {

S.tips = (T) => {

/* ---------- frame ---------- */
function captionHTML(T) {
  for (const k in CUE) { const c = CUE[k];
    if (T >= c.start - 0.05 && T <= c.end + 0.3) {
      const s = c.text.replace(/(\$[\d,.]+(?:\s?million)?|\d+%|\b\d{2,}\b|401\(k\))/g, '<span class="hl">$1</span>');
      return `<div class="cap"><span class="box">${s}</span></div>`; } }
  return '';
}
function setLook(sunset, endCard) {
  scene.background = sunset ? BG_SUNSET : (endCard ? BG_END : BG_NIGHT);
  scene.fog.color.set(sunset ? 0xC2410C : 0x070C1A); scene.fog.near = sunset ? 20 : 16; scene.fog.far = sunset ? 60 : 42;
  floorMat.color.set(sunset ? 0x1F4D2B : 0x0E1629); floorMat.roughness = sunset ? 0.9 : 0.32; floorMat.metalness = sunset ? 0 : 0.25;
  key.color.set(sunset ? 0xFFC58A : 0xffffff); key.intensity = sunset ? 2.6 : 2.4; key.position.set(sunset ? -4 : 5, sunset ? 6 : 10, sunset ? -6 : 7);
  rim.color.set(sunset ? 0xF97316 : 0x60A5FA); hemi.color.set(sunset ? 0xFFD6A5 : 0xbfd4ff); hemi.intensity = sunset ? 0.8 : 0.55;
  floor.visible = !endCard; dust.material.color.set(sunset ? 0xFFE4B5 : 0xFACC15);
}
let ready = false;
window.render = function (T) {
  if (!ready) return;
  for (const k in G) G[k].visible = false;
  let active = null;
  for (const name of ORDER) { const sc = SCENES[name]; if (T >= sc.start - 0.01 && T <= sc.end + 0.01) { active = name; break; } }
  let fade = 0, html = '';
  setLook(active === 'end' && T < C('e4'), active === 'end' && T >= C('e4'));
  // dust
  for (let i = 0; i < DUST; i++) { const b = dustBase[i]; dustPos[i*3] = b[0] + Math.sin(T * 0.3 + b[4]) * 0.3; dustPos[i*3+1] = (b[1] + T * b[3]) % 9; dustPos[i*3+2] = b[2]; }
  dustGeo.attributes.position.needsUpdate = true;
  if (active) { const sc = SCENES[active]; fade = Math.min(1, (T - sc.start) / 0.45, (sc.end - T) / 0.45); html = S[active](T); }
  composer.render();
  const disc = active && ORDER.indexOf(active) < ORDER.indexOf('why') ? 'Fictional characters &middot; Real math &middot; 7% assumed return &middot; Not financial advice' : '';
  document.getElementById('ui').innerHTML = html +
    (disc ? `<div style="position:absolute;left:18px;top:${active === 'race' ? 690 : 12}px;font-size:14px;font-weight:800;color:rgba(148,163,184,0.75)">${disc}</div>` : '') + captionHTML(T);
  document.getElementById('fade').style.opacity = (1 - clamp(fade)).toFixed(3);
};
window.CUE_LIST = () => Object.entries(CUE).map(([k, c]) => ({ key: k, start: c.start, end: c.end, text: c.text }));
(async () => {
  await document.fonts.load('900 64px Montserrat'); await document.fonts.load('800 64px Montserrat');
  build(); ready = true; window.render(0.5); window.READY = true;
})();
</script>
