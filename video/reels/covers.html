<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Reel covers</title><style>
  html, body { margin: 0; padding: 0; background: #05070D; overflow: hidden; }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; font-family: "Montserrat", sans-serif; color: #F8FAFC; }
  #cam, #bg, #svg, #photos, #ov { position: absolute; inset: 0; }
  #svg svg { position: absolute; left: 0; top: 0; }
  .ph { position: absolute; overflow: hidden; background: #000; transform-origin: 50% 50%; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  .ph .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%), linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,.55) 100%); }
  .ph .credit { position: absolute; right: 10px; bottom: 8px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px #000; }
  .ov { position: absolute; text-align: center; font-weight: 900; line-height: 1.05; }
  .glass { position: absolute; border-radius: 26px; border: 2px solid rgba(255,255,255,.18); background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
           backdrop-filter: blur(14px); box-shadow: 0 20px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); box-sizing: border-box; }
  .chip { position: absolute; font-weight: 900; padding: 10px 22px; border-radius: 999px; white-space: nowrap; box-shadow: 0 8px 0 rgba(0,0,0,.35), 0 16px 30px rgba(0,0,0,.45); }
  .stamp { position: absolute; font-weight: 900; padding: 8px 22px; border: 7px solid; border-radius: 16px; background: rgba(5,7,13,.82); white-space: nowrap; letter-spacing: 1px; }
  .ticker { position: absolute; left: 0; width: 720px; height: 54px; background: rgba(2,6,23,.85); border-top: 2px solid #334155; border-bottom: 2px solid #334155; overflow: hidden; white-space: nowrap; font-weight: 900; font-size: 26px; line-height: 54px; }
  .head { position: absolute; left: 26px; right: 26px; top: 46px; text-align: center; font-weight: 900; font-size: 42px; line-height: 1.12; padding: 18px 10px;
          background: linear-gradient(160deg, rgba(15,23,42,.85), rgba(2,6,23,.9)); border: 2px solid rgba(250,204,21,.5); border-radius: 26px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .y { color: #FACC15; } .g { color: #4ADE80; } .r { color: #F87171; } .c { color: #22D3EE; }
  .cap { position: absolute; left: 24px; right: 24px; top: 905px; text-align: center; font-weight: 900; font-size: 56px; line-height: 1.25; }
  .cap .w { display: inline-block; margin: 0 6px; padding: 0 8px; border-radius: 12px; color: #fff;
            text-shadow: 0 0 6px #000, 0 4px 0 #000, 3px 3px 0 #000, -3px 3px 0 #000, 3px -3px 0 #000, -3px -3px 0 #000; }
  .cap .w.cur { background: #FACC15; color: #0B1020; text-shadow: none; box-shadow: 0 6px 0 #A16207; }
  .prog { position: absolute; left: 0; top: 0; width: 720px; height: 10px; background: rgba(255,255,255,.08); }
  .prog div { height: 10px; background: linear-gradient(90deg, #FACC15, #F97316); }
  .disc { position: absolute; left: 0; right: 0; top: 1168px; text-align: center; font-size: 16px; font-weight: 800; color: rgba(148,163,184,.85); }
  .follow { position: absolute; left: 360px; top: 640px; background: linear-gradient(180deg,#F87171,#DC2626); color: #fff; font-weight: 900; font-size: 52px; padding: 20px 56px; border-radius: 999px; box-shadow: 0 10px 0 #7F1D1D, 0 30px 60px rgba(220,38,38,.5); white-space: nowrap; }
  .cursor { position: absolute; font-size: 64px; color: #fff; transform: rotate(-60deg); text-shadow: 0 4px 10px #000; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style></head>
<body><div id="stage"><div id="cam"><div id="bg"></div><div id="svg"></div><div id="photos"></div><div id="ov"></div></div><div id="flash"></div></div>
<script src="data.js"></script><script src="engine.js"></script>
<script>
const ID = new URLSearchParams(location.search).get('id') || 'trump';
const COV = {
 trump: { theme: ['#16A34A', '#DC2626', '#0B1430'], photos: ['floor', 'trump'], draw() {
   photo('floor', { op: 0.55, x: 0, y: 0, w: 720, h: 1280, p: 0, z0: 1.15, z1: 1.15, r: 0, credit: false, filter: 'saturate(.7) brightness(.6)' });
   photo('trump', { op: 1, x: 120, y: 120, w: 480, h: 560, p: 0, z0: 1.12, z1: 1.12, y0: -3, y1: -3, glow: '#FACC15', r: 34 });
   let o = big3d('LOST CONGRESS&hellip;', 720, 70, '#fff', '#CBD5E1', '#334155', 1);
   o += big3d('+1,569', 810, 200, '#BBF7D0', '#16A34A', '#14532D', 1);
   o += chip('WALL STREET EXPLODED', 360, 1080, '#FACC15', '#0B1020', 40, 1, -4, 1);
   let g = ''; for (let i = 0; i < 3; i++) g += `<polygon points="${600 + i * 0},${1000 - i * 60} ${640},${940 - i * 60} ${680},${1000 - i * 60}" fill="#22C55E" opacity="${0.9 - i * 0.25}"/>`;
   return [g, o]; } },
 musk: { theme: ['#7C3AED', '#06B6D4', '#0A0A1F'], photos: ['musk'], draw() {
   photo('musk', { op: 1, x: 40, y: 120, w: 640, h: 600, p: 0, z0: 1.35, z1: 1.35, x0: -6, x1: -6, y0: 2, y1: 2, glow: '#EF4444', r: 34 });
   let o = big3d('$474M', 740, 120, '#FDE68A', '#EAB308', '#854D0E', 1);
   o += ov('&darr;', 0, 860, 720, 90, '#F8FAFC', 1);
   o += big3d('&minus;$33B', 940, 170, '#FCA5A5', '#DC2626', '#7F1D1D', 1);
   o += chip('IN ONE DAY', 360, 1160, '#EF4444', '#fff', 44, 1, -3, 1);
   return ['', o]; } },
 crash: { theme: ['#DC2626', '#0EA5E9', '#140A0E'], photos: ['floor'], draw() {
   photo('floor', { op: 0.5, x: 0, y: 0, w: 720, h: 1280, p: 0, z0: 1.2, z1: 1.2, r: 0, credit: false, filter: 'saturate(.5) brightness(.5) sepia(.3) hue-rotate(-20deg)' });
   const [cg] = glowChart([[0, .45], [.15, .5], [.3, .6], [.45, .72], [.58, .9], [.7, .6], [.85, .38], [1, .2]], 1, 50, 260, 620, 460, '#EF4444', 1);
   let o = big3d('&minus;21%', 700, 220, '#FCA5A5', '#DC2626', '#7F1D1D', 1);
   o += big3d('CRASH IN 2027?', 960, 74, '#fff', '#CBD5E1', '#334155', 1);
   o += chip('EXPERTS WARN', 360, 1120, '#FACC15', '#0B1020', 40, 1, -3, 1);
   return [cg, o]; } },
  crypto: { theme: ['#F7931A', '#0EA5E9', '#0D0905'], photos: ['floor'], draw() {
   photo('floor', { op: 0.6, x: 0, y: 0, w: 720, h: 1280, p: 0, z0: 1.25, z1: 1.25, r: 0, credit: false, filter: 'saturate(.6) brightness(.45) sepia(.6) hue-rotate(-12deg)' });
   let g = `<defs><radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFB547" stop-opacity=".95"/><stop offset=".45" stop-color="#F7931A" stop-opacity=".35"/><stop offset="1" stop-color="#F7931A" stop-opacity="0"/></radialGradient></defs>`;
   for (let i = 0; i < 18; i++) { const a0 = i / 18 * Math.PI * 2, a1 = a0 + 0.09; g += `<polygon points="330,520 ${330 + Math.cos(a0) * 700},${520 + Math.sin(a0) * 700} ${330 + Math.cos(a1) * 700},${520 + Math.sin(a1) * 700}" fill="#FFC86B" opacity=".13"/>`; }
   g += `<circle cx="330" cy="520" r="330" fill="url(#sun)"/>`;
   const [cg] = glowChart([[0, .05], [.2, .1], [.35, .2], [.5, .18], [.65, .45], [.8, .62], [.92, .9], [1, 1]], 1, 30, 600, 660, 300, '#22C55E', 1);
   g += cg + cryptoCoin('btc', 320, 520, 185, 0.3, 1) + cryptoCoin('xrp', 560, 690, 100, -0.45, 1);
   for (let i = 0; i < 10; i++) g += coinSVG(50 + i * 70, 250 + ((i * 53) % 120), 18, 0.85);
   let o = `<div class="ov" style="left:0;top:58px;width:720px"><span style="display:inline-block;padding:12px 30px;border-radius:22px;background:rgba(2,6,23,.85);border:4px solid #22C55E;box-shadow:0 0 40px rgba(34,197,94,.55);font-size:66px;color:#fff">$1,000 <span style="color:#FACC15">&#10140;</span> <span class="g">$200,000</span></span></div>`;
   o += `<div class="ov" style="left:560px;top:270px;width:140px;font-size:96px;transform:rotate(12deg)">🚀</div>`;
   o += big3d('RICH BY', 800, 118, '#fff', '#CBD5E1', '#334155', 1);
   o += big3d('2030?', 915, 218, '#FFF3C4', '#FACC15', '#A16207', 1, 1, 'filter:drop-shadow(0 0 30px rgba(250,204,21,.55))');
   o += chip('BITCOIN + XRP 🔥', 360, 1195, '#EF4444', '#fff', 46, 1, -3, 1);
   return [g, o]; } },
  card: { theme: ['#DC2626', '#22C55E', '#140A0E'], photos: [], draw() {
   let g = `<defs><radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FACC15" stop-opacity=".7"/><stop offset="1" stop-color="#FACC15" stop-opacity="0"/></radialGradient></defs><circle cx="360" cy="560" r="330" fill="url(#sun)"/>`;
   for (let r = 0; r < 4; r++) g += `<circle cx="360" cy="560" r="${170 + r * 60}" fill="none" stroke="#FACC15" stroke-width="6" opacity="${0.8 - r * 0.18}"/>`;
   g += `<g transform="translate(560 860) rotate(-12)"><rect x="-130" y="-80" width="260" height="160" rx="22" fill="#1E293B" stroke="#F8FAFC" stroke-width="7"/><rect x="-130" y="-48" width="260" height="32" fill="#020617"/><rect x="-100" y="6" width="52" height="38" rx="7" fill="#EAB308"/>${svgText(112, 60, '22.5%', 46, '#F87171', 900, 'end')}<line x1="-10" y1="62" x2="118" y2="20" stroke="#F87171" stroke-width="8"/></g>`;
   g += `<g transform="translate(560 690)"><polygon points="-26,-40 26,-40 26,10 50,10 0,60 -50,10 -26,10" fill="#22C55E" stroke="#052E16" stroke-width="5"/></g>`;
   let o = `<div class="ov" style="left:160px;top:420px;width:400px;font-size:250px;transform:rotate(-12deg)">📞</div>`;
   o += big3d('BANKS HOPE YOU', 80, 62, '#fff', '#CBD5E1', '#334155', 1) + big3d('NEVER MAKE', 165, 100, '#FEF3C7', '#EAB308', '#854D0E', 1) + big3d('THIS CALL', 975, 120, '#FECACA', '#DC2626', '#7F1D1D', 1);
   o += chip('5 MINUTES', 360, 1205, '#22C55E', '#052E16', 50, 1, -3, 1);
   return [g, o]; } },
  mortgage: { theme: ['#3B82F6', '#DC2626', '#0B1430'], photos: ['suburb'], draw() {
   photo('suburb', { op: 0.5, x: 0, y: 0, w: 720, h: 1280, p: 0, z0: 1.2, z1: 1.2, r: 0, credit: false, filter: 'saturate(.6) brightness(.45)' });
   const house = (x, col) => `<g transform="translate(${x} 600) scale(1.5)"><polygon points="-90,-10 0,-90 90,-10" fill="${col}" stroke="#F8FAFC" stroke-width="6" stroke-linejoin="round"/><rect x="-70" y="-14" width="140" height="94" fill="#E2E8F0" stroke="#F8FAFC" stroke-width="6"/><rect x="-18" y="24" width="36" height="56" fill="#475569"/><rect x="-56" y="4" width="28" height="26" fill="#93C5FD"/><rect x="28" y="4" width="28" height="26" fill="#93C5FD"/></g>`;
   let g = house(190, '#22C55E') + house(530, '#DC2626') + `<text x="360" y="640" font-family="Montserrat" font-weight="900" font-size="80" fill="#FACC15" text-anchor="middle" stroke="#020617" stroke-width="10" paint-order="stroke fill">=</text>`;
   let o = big3d('SAME HOUSE', 120, 100, '#fff', '#CBD5E1', '#334155', 1);
   o += ov('$2,455<span style="font-size:24px">/mo</span>', 40, 760, 300, 50, '#4ADE80', 1, 'text-shadow:0 3px 0 #000') + ov('$2,710<span style="font-size:24px">/mo</span>', 380, 760, 300, 50, '#F87171', 1, 'text-shadow:0 3px 0 #000');
   o += big3d('+$90,000', 880, 140, '#FECACA', '#DC2626', '#7F1D1D', 1) + chip('WHY?! 🤯', 360, 1130, '#FACC15', '#0B1020', 52, 1, -3, 1);
   return [g, o]; } },
  savings: { theme: ['#22C55E', '#0EA5E9', '#06140C'], photos: [], draw() {
   let g = isoBar(200, 900, 200, 50, '#64748B') + isoBar(500, 900, 200, 430, '#22C55E');
   let o = big3d('YOU MAY BE', 90, 80, '#fff', '#CBD5E1', '#334155', 1) + big3d('MISSING $378', 180, 96, '#FECACA', '#DC2626', '#7F1D1D', 1);
   o += ov('$57', 100, 730, 200, 80, '#E2E8F0', 1, 'text-shadow:0 4px 0 #000') + ov('$435', 390, 300, 240, 96, '#4ADE80', 1, 'text-shadow:0 4px 0 #000');
   o += ov('YOUR BANK?', 80, 960, 240, 30, '#94A3B8', 1) + ov('HIGH-YIELD', 390, 960, 240, 30, '#94A3B8', 1);
   o += chip('CHECK YOURS 👀', 360, 1130, '#FACC15', '#0B1020', 50, 1, -3, 1);
   return [g, o]; } },
  nocut: { theme: ['#DC2626', '#3B82F6', '#120A14'], photos: ['fed-eccles'], draw() {
   photo('fed-eccles', { op: 0.7, x: 0, y: 0, w: 720, h: 1280, p: 0, z0: 1.35, z1: 1.35, y0: -6, y1: -6, r: 0, credit: false, filter: 'saturate(.7) brightness(.5) contrast(1.15)' });
   let g = `<g transform="translate(360 560)"><circle r="230" fill="#DC2626" opacity=".18"/><line x1="-170" y1="-170" x2="170" y2="170" stroke="#EF4444" stroke-width="44" stroke-linecap="round"/><line x1="170" y1="-170" x2="-170" y2="170" stroke="#EF4444" stroke-width="44" stroke-linecap="round"/></g>`;
   let o = big3d('RATE<br>CUT?', 330, 150, '#FFFFFF', '#CBD5E1', '#334155', 1);
   o += big3d('NOT COMING', 860, 84, '#FECACA', '#DC2626', '#7F1D1D', 1, 1, 'white-space:nowrap');
   o += chip('85% ODDS OF A HIKE 😬', 360, 1080, '#FACC15', '#0B1020', 46, 1, -3, 1);
   o += chip('DEC 9', 360, 160, '#DC2626', '#fff', 44, 1, 3, 1);
   return [g, o]; } },
  gold: { theme: ['#EAB308', '#DC2626', '#140F04'], photos: ['mint'], draw() {
   photo('mint', { op: 0.45, x: 0, y: 0, w: 720, h: 1280, p: 0, z0: 1.3, z1: 1.3, r: 0, credit: false, filter: 'saturate(1.2) brightness(.45) sepia(.4)' });
   const bar = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><polygon points="-70,0 70,0 52,-34 -52,-34" fill="#FDE68A"/><polygon points="-70,0 70,0 70,26 -70,26" fill="#CA8A04"/><polygon points="70,0 52,-34 52,-8 70,26" fill="#A16207"/><polygon points="-40,-30 40,-30 30,-12 -30,-12" fill="#FFF7CC" opacity=".6"/></g>`;
   let g = `<defs><radialGradient id="gg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FACC15" stop-opacity=".55"/><stop offset="1" stop-color="#FACC15" stop-opacity="0"/></radialGradient></defs><circle cx="360" cy="600" r="320" fill="url(#gg)"/>`;
   [[220, 640], [360, 640], [500, 640], [290, 585], [430, 585], [360, 530]].forEach(([x, y]) => g += bar(x, y, 1.5));
   g += `<path d="M120 420 L300 520 L380 470 L600 760" stroke="#EF4444" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polygon points="560,780 640,800 620,720" fill="#EF4444"/>`;
   let o = big3d('GOLD', 110, 120, '#FEF3C7', '#EAB308', '#854D0E', 1) + big3d('&minus;28%', 780, 170, '#FECACA', '#DC2626', '#7F1D1D', 1);
   o += chip('BARGAIN?', 210, 1100, '#22C55E', '#052E16', 46, 1, -5, 1) + chip('TRAP?', 520, 1100, '#EF4444', '#fff', 46, 1, 5, 1);
   return [g, o]; } },
};
const R = COV[ID];
document.fonts.ready.then(() => initPhotos(R.photos, window.CREDITS || {})).then(() => {
  hidePhotos(); const [g, o] = R.draw();
  document.getElementById('svg').innerHTML = `<svg width="720" height="1280" viewBox="0 0 720 1280">${DEFS}${background(2.0, R.theme)}</svg>`;
  document.getElementById('ov').innerHTML = `<svg style="position:absolute;left:0;top:0" width="720" height="1280" viewBox="0 0 720 1280">${DEFS}${g}</svg>` + o; window.READY = true; });
</script></body></html>
