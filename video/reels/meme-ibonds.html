<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Penny & Buck: I Bonds 5.51%</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; font-family: "Montserrat", sans-serif; }
  svg { position: absolute; left: 0; top: 0; }
  .cap { position: absolute; left: 30px; right: 30px; top: 70px; text-align: center; color: #fff; font-weight: 800; font-size: 40px; line-height: 1.25;
         text-shadow: 0 2px 0 #000, 0 0 10px rgba(0,0,0,.6), 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000; }
  .big { position: absolute; left: 0; width: 720px; text-align: center; font-weight: 900; }
  .foot { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; color: rgba(255,255,255,.85); font-weight: 700; font-size: 17px; text-shadow: 0 1px 3px #000; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style></head>
<body><div id="stage"><div id="cam" style="position:absolute;inset:0"><div id="s"></div><div id="ov"></div></div><div id="flash"></div></div>
<script>
const W = 720, H = 1280, LOOP = 6.2, DROP = 3.85, TOTAL = 12.4;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = x => { x = clamp(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const pop = (T, t0, d = 0.35) => { const x = (T - t0) / d; return x <= 0 ? 0 : easeBack(x); };
const R = s => () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
const BEAT = 0.55;

/* ---------- scenery ---------- */
function sky(T, rain) {
  let g = `<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B6FB6"/><stop offset=".6" stop-color="#8DB8E8"/><stop offset="1" stop-color="#C9E2F5"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5DA83A"/><stop offset="1" stop-color="#2F7D25"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6B98A"/><stop offset=".45" stop-color="#D9783E"/><stop offset="1" stop-color="#8A3E14"/></linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9F2C7"/><stop offset=".5" stop-color="#7BC67A"/><stop offset="1" stop-color="#3E8E45"/></linearGradient>
    <linearGradient id="jeans" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E3A8A"/><stop offset=".5" stop-color="#3B5BCC"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1A8"/><stop offset=".5" stop-color="#F5C518"/><stop offset="1" stop-color="#B7860B"/></linearGradient>
  </defs>
  <rect width="720" height="760" fill="url(#sky)"/>`;
  if (rain) {
    const r = R(7);
    for (let i = 0; i < 7; i++) { const x = (r() * 900 + T * 14) % 900 - 120, y = 140 + r() * 380, s = 0.7 + r() * 0.8;
      g += `<g opacity=".95" transform="translate(${x} ${y}) scale(${s})">${[[0, 0, 60], [50, -20, 70], [110, 0, 55], [60, 20, 60]].map(([a, b, c]) => `<circle cx="${a}" cy="${b}" r="${c}" fill="#fff"/>`).join('')}</g>`; }
  }
  g += `<rect y="700" width="720" height="580" fill="url(#grass)"/><rect y="700" width="720" height="6" fill="#86C75F" opacity=".7"/>`;
  return g;
}

/* ---------- limbs ---------- */
function leg(hipX, hipY, len, phase, col, shoe, w = 26) {
  const lift = Math.max(0, Math.sin(phase)) * 46, kneeOut = Math.sin(phase) * 10;
  const footY = hipY + len - lift, kneeY = hipY + len * 0.5 - lift * 0.6, kneeX = hipX + kneeOut;
  return `<path d="M${hipX} ${hipY} L${kneeX} ${kneeY} L${hipX} ${footY}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="${hipX + 6}" cy="${footY + 6}" rx="${w * 1.1}" ry="${w * 0.55}" fill="${shoe}"/><ellipse cx="${hipX + 6}" cy="${footY + 12}" rx="${w * 1.1}" ry="${w * 0.25}" fill="#F8FAFC"/>`;
}
function arm(sx, sy, len, ang, col, glove, w = 22, wave = 0) {
  const a = (90 + ang) * Math.PI / 180, ex = sx + Math.cos(a) * len * 0.52, ey = sy + Math.sin(a) * len * 0.52;
  const a2 = a - wave * Math.PI / 180, hx = ex + Math.cos(a2) * len * 0.5, hy = ey + Math.sin(a2) * len * 0.5;
  return `<path d="M${sx} ${sy} L${ex} ${ey} L${hx} ${hy}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${hx}" cy="${hy}" r="${w * 0.85}" fill="${glove}"/>`;
}
function eyes(x, y, sp, r, look = 0, blink = 1) {
  return [-1, 1].map(d => `<ellipse cx="${x + d * sp}" cy="${y}" rx="${r}" ry="${r * 1.15 * blink}" fill="#fff" stroke="#1E293B" stroke-width="3"/>
    <circle cx="${x + d * sp + look * r * 0.35}" cy="${y + 2}" r="${r * 0.5 * Math.max(blink, .2)}" fill="#0F172A"/><circle cx="${x + d * sp + look * r * 0.35 + 3}" cy="${y - 3}" r="${r * 0.15}" fill="#fff"/>`).join('');
}

/* ---------- Penny: a copper coin ---------- */
function penny(x, y, s, T, phase, mood) {
  const bob = Math.abs(Math.sin(phase)) * -12, blink = (T % 3.1) < 0.12 ? 0.15 : 1;
  let g = `<ellipse cx="${x}" cy="${y + 4}" rx="${110 * s}" ry="${22 * s}" fill="url(#shadow)"/><g transform="translate(${x} ${y + bob}) scale(${s})">`;
  g += leg(-34, -150, 150, phase, '#1F2937', '#DC2626', 24) + leg(34, -150, 150, phase + Math.PI, '#1F2937', '#DC2626', 24);
  g += arm(-112, -270, 120, 20 + Math.sin(phase) * 24 + (mood === 'party' ? 120 : 0), '#1F2937', '#fff', 20, mood === 'party' ? 40 : 0);
  g += arm(112, -270, 120, -20 - Math.sin(phase) * 24 - (mood === 'party' ? 120 : 0), '#1F2937', '#fff', 20, mood === 'party' ? -40 : 0);
  // coin body (with edge thickness)
  g += `<circle cx="10" cy="-270" r="125" fill="#7A3410"/><circle cx="0" cy="-275" r="125" fill="url(#copper)"/>
    <circle cx="0" cy="-275" r="104" fill="none" stroke="#FCD3B0" stroke-opacity=".6" stroke-width="5"/>
    <circle cx="0" cy="-275" r="112" fill="none" stroke="#8A3E14" stroke-width="3" stroke-dasharray="4 7"/>
    <path d="M-70 -350 A100 100 0 0 1 40 -372" stroke="#fff" stroke-opacity=".45" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  g += eyes(0, -300, 34, 24, Math.sin(T * 1.3), blink);
  g += `<path d="M-30 -258 Q-24 -262 -16 -260" stroke="#5B2508" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M16 -260 Q24 -262 30 -258" stroke="#5B2508" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  g += mood === 'party' ? `<path d="M-38 -235 Q0 -175 38 -235 Z" fill="#5B0F0F"/><path d="M-22 -205 Q0 -192 22 -205" fill="#F87171"/>` :
    `<ellipse cx="0" cy="-222" rx="${14 + 6 * Math.abs(Math.sin(T * 9))}" ry="${10 + 8 * Math.abs(Math.sin(T * 9))}" fill="#5B0F0F"/>`;
  g += `<text x="0" y="-150" font-family="Montserrat" font-weight="900" font-size="30" fill="#FCD3B0" text-anchor="middle" opacity=".85">1¢</text>`;
  return g + '</g>';
}

/* ---------- Buck: a tall dollar bill ---------- */
function buck(x, y, s, T, phase, mood) {
  const bob = Math.abs(Math.sin(phase)) * -10, blink = ((T + 1.3) % 3.4) < 0.12 ? 0.15 : 1;
  let g = `<ellipse cx="${x}" cy="${y + 4}" rx="${105 * s}" ry="${22 * s}" fill="url(#shadow)"/><g transform="translate(${x} ${y + bob}) scale(${s})">`;
  g += leg(-30, -230, 230, phase + Math.PI, 'url(#jeans)', '#111827', 30) + leg(30, -230, 230, phase, 'url(#jeans)', '#111827', 30);
  g += arm(-96, -470, 190, 6 - Math.sin(phase) * 16 + (mood === 'party' ? 130 : 0), '#7BC67A', '#F8FAFC', 24, mood === 'party' ? 50 : 0);
  g += arm(92, -470, 190, -6 + Math.sin(phase) * 16 - (mood === 'party' ? 130 : 0), '#7BC67A', '#F8FAFC', 24, mood === 'party' ? -50 : 0);
  // bill body: tall rectangle with thickness
  g += `<rect x="-92" y="-612" width="196" height="400" rx="22" fill="#2F6B35"/><rect x="-100" y="-620" width="196" height="400" rx="22" fill="url(#bill)" stroke="#1F5A2A" stroke-width="5"/>
    <rect x="-84" y="-604" width="164" height="368" rx="14" fill="none" stroke="#1F5A2A" stroke-width="3" stroke-dasharray="10 6"/>
    ${[[-74, -592], [62, -592], [-74, -262], [62, -262]].map(([a, b]) => `<text x="${a}" y="${b}" font-family="Montserrat" font-weight="900" font-size="26" fill="#1F5A2A" text-anchor="middle" dominant-baseline="hanging">1</text>`).join('')}
    <ellipse cx="-2" cy="-500" rx="66" ry="80" fill="#E8F8E4" stroke="#1F5A2A" stroke-width="4"/>
    <ellipse cx="-2" cy="-330" rx="46" ry="46" fill="#E8F8E4" stroke="#1F5A2A" stroke-width="4"/>
    <text x="-2" y="-312" font-family="Montserrat" font-weight="900" font-size="58" fill="#1F5A2A" text-anchor="middle">$</text>
    <path d="M-90 -615 L-60 -615 L-90 -585 Z" fill="#fff" opacity=".35"/>`;
  // face in the portrait oval
  g += eyes(-2, -520, 26, 19, Math.sin(T * 1.1 + 2), blink);
  g += `<path d="M-34 -552 L-14 -546" stroke="#14532D" stroke-width="6" stroke-linecap="round"/><path d="M10 -546 L30 -552" stroke="#14532D" stroke-width="6" stroke-linecap="round"/>`;
  g += mood === 'party' ? `<path d="M-30 -478 Q-2 -432 26 -478 Z" fill="#14532D"/>` : `<path d="M-24 -470 Q-2 -456 20 -470" stroke="#14532D" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  // tie
  g += `<path d="M-2 -420 L-16 -404 L-2 -360 L12 -404 Z" fill="#DC2626" stroke="#7F1D1D" stroke-width="3"/>`;
  return g + '</g>';
}

/* ---------- money rain ---------- */
function billSVG(x, y, rot, flip, s = 1) {
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${Math.max(.15, Math.abs(flip)) * s} ${s})"><rect x="-42" y="-20" width="84" height="40" rx="5" fill="url(#bill)" stroke="#1F5A2A" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="13" ry="15" fill="#E8F8E4" stroke="#1F5A2A" stroke-width="2"/><text x="0" y="7" font-family="Montserrat" font-weight="900" font-size="18" fill="#1F5A2A" text-anchor="middle">$</text></g>`;
}
function coinSVG(x, y, flip, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${Math.max(.15, Math.abs(flip)) * s} ${s})"><circle r="20" fill="#9A6B05"/><circle cy="-3" r="20" fill="url(#gold)" stroke="#B7860B" stroke-width="2"/>
    <text x="0" y="5" font-family="Montserrat" font-weight="900" font-size="20" fill="#7A5600" text-anchor="middle">$</text></g>`;
}
function rain(k) {
  const r = R(31); let back = '', front = '', pile = '';
  for (let i = 0; i < 70; i++) {
    const x0 = r() * 760 - 20, delay = r() * 1.6, sp = 380 + r() * 260, isCoin = r() < 0.35, rot0 = r() * 360, spin = 2 + r() * 5, layer = r();
    const t = k - delay; if (t < 0) continue;
    const yLand = 760 + r() * 460, y = -60 + t * sp + 120 * t * t;
    const sway = Math.sin(t * 3 + i) * 30;
    if (y >= yLand) { pile += isCoin ? coinSVG(x0 + sway, yLand, 0.9, 0.9) : billSVG(x0 + sway, yLand, rot0 * 0.2 - 30, 1, 0.95); continue; }
    const el = isCoin ? coinSVG(x0 + sway, y, Math.cos(t * spin * 2)) : billSVG(x0 + sway, y, rot0 + t * 90, Math.cos(t * spin), 1);
    if (layer < 0.6) back += el; else front += el;
  }
  return [pile, back, front];
}

/* ---------- captions per beat ---------- */
const CAPS = [
  [0, 'POV: you find out the US government is paying <span style="color:#FDE047">5.51%</span> on savings 😳'],
  [DROP, ''],
  [LOOP, 'And the fixed part (<span style="color:#FDE047">1.40%</span>) is the highest since <span style="color:#FDE047">2006</span> 🤯'],
  [LOOP + DROP, ''],
];
function bigText(T) {
  const k1 = T - DROP, k2 = T - (LOOP + DROP);
  if (T >= DROP && T < LOOP) {
    const s = pop(T, DROP, 0.3);
    return `<div class="big" style="top:150px;font-size:58px;color:#fff;-webkit-text-stroke:3px #0F172A;transform:scale(${s})">I BONDS NOW PAY</div>
      <div class="big" style="top:220px;font-size:170px;line-height:1;transform:scale(${s * (1 + 0.04 * Math.sin(k1 * 12))});background:linear-gradient(180deg,#FFF7AE,#F5C518 55%,#B7860B);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 8px 0 #7A5600) drop-shadow(0 18px 20px rgba(0,0,0,.45))">5.51%</div>
      <div class="big" style="top:410px;font-size:30px;color:#fff;-webkit-text-stroke:1.5px #0F172A;opacity:${clamp((k1 - 0.5) / 0.3)}">💸 NOV 2026 – APR 2027 💸</div>`;
  }
  if (T >= LOOP + DROP) {
    const rows = ['✅ Backed by the U.S. Treasury', '✅ Up to $10,000 a year per person', '⚠️ Locked for 1 year (lose 3 months’ interest if sold before 5 years)'];
    return rows.map((t, i) => { const s = pop(T, LOOP + DROP + 0.15 + i * 0.45, 0.3); return s <= 0 ? '' :
      `<div style="position:absolute;left:40px;right:40px;top:${140 + i * 128}px;padding:14px 18px;border-radius:22px;background:rgba(15,23,42,.82);color:#fff;font-weight:900;font-size:${i === 2 ? 24 : 30}px;line-height:1.2;text-align:center;border:3px solid ${i === 2 ? '#F59E0B' : '#22C55E'};transform:scale(${s});box-shadow:0 10px 24px rgba(0,0,0,.35)">${t}</div>`; }).join('') +
      `<div style="position:absolute;left:80px;right:80px;top:540px;padding:10px;border-radius:999px;background:#F5C518;color:#0F172A;font-weight:900;font-size:26px;text-align:center;box-shadow:0 6px 0 #7A5600;transform:scale(${pop(T, LOOP + DROP + 1.6, 0.3)})">TreasuryDirect.gov · Follow for more 💰</div>`;
  }
  return '';
}

function frame(T) {
  const cyc = T % LOOP, rainOn = cyc >= DROP, k = cyc - DROP;
  let g = sky(T, rainOn);
  const phase = (T / BEAT) * Math.PI;   // one step per beat
  let pile = '', back = '', front = '';
  if (rainOn) [pile, back, front] = rain(k);
  g += pile + back;
  if (!rainOn) {   // walking toward camera, side by side
    const walkS = 1 + cyc * 0.025;
    g += buck(470, 1130, 0.98 * walkS, T, phase, 'walk') + penny(250, 1130, 0.98 * walkS, T, phase, 'walk');
  } else {         // drop: swap sides, zoom out a bit, bounce & party
    const hop = Math.abs(Math.sin(k * Math.PI / BEAT)) * -28;
    g += penny(470, 1180 + hop, 0.8, T, phase * 1.5, 'party') + buck(250, 1180 + hop * 0.7, 0.8, T, phase * 1.5 + 1, 'party');
  }
  g += front;
  document.getElementById('s').innerHTML = `<svg width="720" height="1280" viewBox="0 0 720 1280">${g}</svg>`;
  let cap = ''; for (const [t0, c] of CAPS) if (T >= t0) cap = c;
  document.getElementById('ov').innerHTML = (cap ? `<div class="cap">${cap}</div>` : '') + bigText(T) +
    `<div class="foot">Original characters &amp; animation: The Money Map · Rates: U.S. Treasury · Not financial advice</div>`;
  const sh = [DROP, LOOP + DROP].map(t0 => T - t0).filter(d => d >= 0 && d < 0.35).map(d => (1 - d / 0.35) * 16)[0] || 0;
  document.getElementById('cam').style.transform = sh ? `translate(${Math.sin(T * 90) * sh}px,${Math.cos(T * 70) * sh}px) scale(${1 + sh / 400})` : '';
  document.getElementById('flash').style.opacity = [DROP, LOOP + DROP].map(t0 => T - t0).filter(d => d >= 0 && d < 0.2).map(d => 0.7 * (1 - d / 0.2))[0] || 0;
}
window.TOTAL = TOTAL;
window.READY = false;
document.fonts.ready.then(() => { frame(0.4); window.READY = true; });
window.render = frame;
</script>
</body></html>
