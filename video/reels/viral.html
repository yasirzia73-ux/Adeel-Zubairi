<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Viral money Shorts</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070D; overflow: hidden; }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; font-family: "Montserrat", sans-serif; color: #F8FAFC; }
  #cam, #bg, #svg, #photos, #ov { position: absolute; inset: 0; }
  #svg svg { position: absolute; left: 0; top: 0; }
  .ph { position: absolute; overflow: hidden; background: #000; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  .ph .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  .ph .credit { position: absolute; right: 10px; bottom: 8px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px #000; }
  .ov { position: absolute; text-align: center; font-weight: 900; line-height: 1.05; }
  .glass { position: absolute; border-radius: 26px; border: 3px solid rgba(255,255,255,.2); background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
           backdrop-filter: blur(14px); box-shadow: 0 20px 50px rgba(0,0,0,.45); box-sizing: border-box; }
  .chip { position: absolute; font-weight: 900; padding: 10px 22px; border-radius: 999px; white-space: nowrap; box-shadow: 0 8px 0 rgba(0,0,0,.35), 0 16px 30px rgba(0,0,0,.45); }
  .stamp { position: absolute; font-weight: 900; padding: 8px 22px; border: 7px solid; border-radius: 16px; background: rgba(5,7,13,.85); white-space: nowrap; }
  .y { color: #FACC15; } .g { color: #4ADE80; } .r { color: #F87171; }
  .brand { position: absolute; left: 0; right: 0; top: 1190px; text-align: center; font-weight: 900; font-size: 22px; color: rgba(248,250,252,.6); letter-spacing: 2px; }
  .foot { position: absolute; left: 0; right: 0; top: 1225px; text-align: center; font-size: 15px; font-weight: 700; color: rgba(148,163,184,.8); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style></head>
<body><div id="stage"><div id="cam"><div id="bg"></div><div id="svg"></div><div id="photos"></div><div id="ov"></div></div><div id="flash"></div></div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
const ID = new URLSearchParams(location.search).get('id') || 'penny';
const usd = (n, c = 0) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: c, maximumFractionDigits: c });

/* ================= PENNY: $1M now or a penny doubled for 30 days ================= */
// day timeline: days 1-20 fast (2.6s .. 7.6s), days 21-30 slower with a hit each (7.6s .. 15.6s)
const dayAt = T => T < 2.6 ? 0 : T < 7.6 ? 1 + 19 * (T - 2.6) / 5 : Math.min(30, 20 + (T - 7.6) / 0.8);
const PENNY_HITS = Array.from({ length: 10 }, (_, k) => 7.6 + (k + 1) * 0.8 - 0.8 + 0.8); // days 21..30
function penny(T) {
  let g = '', o = '';
  if (T < 2.8) {   // the question
    const v = clamp((2.8 - T) / 0.25);
    o += big3d('WHICH ONE<br>WOULD YOU PICK?', 250, 64, '#FFFFFF', '#CBD5E1', '#334155', v * clamp(pop(T, 0.05)), pop(T, 0.05));
    const s1 = pop(T, 0.4), s2 = pop(T, 0.9);
    o += glass(40, 470, 300, 380, `<div style="text-align:center;margin-top:50px;font-size:90px">💵</div><div style="text-align:center;font-size:64px;font-weight:900;color:#4ADE80">$1<br>MILLION</div><div style="text-align:center;font-size:26px;font-weight:800;color:#CBD5E1;margin-top:8px">RIGHT NOW</div>`, v * clamp(s1), 'rgba(34,197,94,.8)', `transform:scale(${s1})`);
    o += glass(380, 470, 300, 380, `<div style="text-align:center;margin-top:50px;font-size:90px">🪙</div><div style="text-align:center;font-size:64px;font-weight:900;color:#FACC15">1¢</div><div style="text-align:center;font-size:26px;font-weight:800;color:#CBD5E1;margin-top:12px;line-height:1.3">DOUBLED<br>EVERY DAY<br>FOR 30 DAYS</div>`, v * clamp(s2), 'rgba(250,204,21,.8)', `transform:scale(${s2})`);
    o += ov('VS', 300, 620, 120, 56, '#F87171', v * clamp(s2));
    return [g, o];
  }
  const d = dayAt(T), day = Math.max(1, Math.floor(d)), val = 0.01 * Math.pow(2, day - 1), passed = day >= 28;
  // header: day counter
  o += `<div class="ov" style="left:0;top:150px;width:720px;font-size:42px;color:#CBD5E1">DAY</div>` + big3d(String(day), 200, 150, '#FFFFFF', '#CBD5E1', '#334155', 1, 1 + (T > 7.6 ? 0.06 * Math.max(0, 1 - ((T - 7.6) % 0.8) / 0.25) : 0));
  // money counter
  const cents = day < 15;
  o += big3d(usd(val, cents ? 2 : 0), 420, val >= 1e6 ? 96 : 110, passed ? '#DCFCE7' : '#FEF3C7', passed ? '#16A34A' : '#EAB308', passed ? '#14532D' : '#854D0E', 1);
  // race bars: $1M line vs penny bar (log-ish visual so early days are visible)
  const H = 520, base = 1130, frac = Math.min(1.12, val / 1e6), hp = H * Math.min(1, Math.pow(frac, 0.42));
  g += `<line x1="60" y1="${base - H * 1}" x2="660" y2="${base - H * 1}" stroke="#4ADE80" stroke-width="5" stroke-dasharray="14 10"/>` + svgText(650, base - H - 14, '$1,000,000', 30, '#4ADE80', 900, 'end');
  g += isoBar(250, base, 170, H * 0.999, 'rgba(34,197,94,.35)') + isoBar(470, base, 170, Math.max(6, hp), passed ? C.green : C.gold);
  g += svgText(250, base + 40, '$1M NOW', 26, '#94A3B8') + svgText(470, base + 40, 'THE PENNY', 26, '#94A3B8');
  if (day >= 18 && day <= 25) o += chip('STILL LOSING… 😬', 360, 585, '#EF4444', '#fff', 34, 1, -3, pop(T, 2.6 + 5 * 17 / 19));
  if (passed) o += stamp('PASSED $1 MILLION!', 360, 625, '#4ADE80', 40, pop(T, 7.6 + 8 * 0.8), -4);
  if (day >= 30) {
    g += confettiSVG(T, 15.6, 360, 500, 80);
    o += chip('THAT\'S COMPOUNDING 🤯', 360, 720, '#FACC15', '#0B1020', 40, 1, 3, pop(T, 15.9));
  }
  return [g, o];
}

/* ================= HOUSE: a $400K loan really costs $975K ================= */
const MR = 0.0718 / 12, PAY = 400000 * MR / (1 - Math.pow(1 + MR, -360)), TOT = Math.round(PAY * 360), INT = TOT - 400000;
const CUM = [[0, 0]]; { let b = 400000, ci = 0, cp = 0; for (let m = 1; m <= 360; m++) { const i = b * 0.0718 / 12, pr = PAY - i; b -= pr; ci += i; cp += pr; CUM.push([cp, ci]); } }
function house(T) {
  let g = '', o = '';
  photo('suburb', { op: 1, x: 30, y: 210, w: 660, h: 380, p: T / 16, z0: 1.3, z1: 1.05, glow: C.gold });
  if (T < 3.4) {
    o += chip('🏠 HOME LOAN: $400,000', 360, 660, '#FACC15', '#0B1020', 44, 1, -3, pop(T, 0.15));
    o += big3d('GUESS WHAT YOU<br>REALLY PAY BACK 👀', 760, 62, '#FFFFFF', '#CBD5E1', '#334155', clamp(pop(T, 1.0)), pop(T, 1.0));
    return [g, o];
  }
  const p = clamp((T - 3.4) / 8.2), e = p < 1 ? Math.pow(p, 1.25) : 1, year = Math.max(1, Math.ceil(30 * p)), paid = TOT * e;
  o += `<div class="ov" style="left:0;top:640px;width:720px;font-size:34px;color:#CBD5E1">YEAR ${year} OF 30 · 7.18%</div>`;
  o += big3d(usd(CUM[Math.round(360 * e)][0] + CUM[Math.round(360 * e)][1]), 690, 116, p < 1 ? '#FEF3C7' : '#FECACA', p < 1 ? '#EAB308' : '#DC2626', p < 1 ? '#854D0E' : '#7F1D1D', 1, 1 + (p >= 1 ? 0.05 * Math.sin((T - 11.6) * 9) : 0));
  // stacked bar: loan vs interest
  const W2 = 600, x0 = 60, y0 = 860, loanW = W2 * 400000 / TOT, intW = W2 * INT / TOT;
  const mo = Math.round(360 * e), [cp, ci] = CUM[mo];
  g += `<rect x="${x0}" y="${y0}" width="${W2}" height="64" rx="16" fill="#1E293B"/>`;
  g += `<rect x="${x0}" y="${y0}" width="${W2 * cp / TOT}" height="64" rx="16" fill="${C.blue}"/>`;
  g += `<rect x="${x0 + W2 * cp / TOT}" y="${y0}" width="${W2 * ci / TOT}" height="64" rx="16" fill="${C.red}"/>`;
  o += `<div class="ov" style="left:60px;top:940px;width:300px;text-align:left;font-size:26px;color:#93C5FD">HOUSE ${usd(cp)}</div><div class="ov" style="left:360px;top:940px;width:300px;text-align:right;font-size:26px;color:#F87171">INTEREST ${usd(ci)}</div>`;
  if (p > 0.08 && p < 0.55) o += chip('EARLY YEARS = MOSTLY INTEREST 😬', 360, 1040, '#EF4444', '#fff', 28, 1, -2, pop(T, 3.4 + 8.2 * 0.08));
  if (p >= 1) {
    o += stamp(`${usd(INT)} IS JUST INTEREST`, 360, 1045, '#F87171', 36, pop(T, 12.0), -4);
    o += chip('MORE THAN THE HOUSE ITSELF 🤯', 360, 1130, '#FACC15', '#0B1020', 30, 1, 2, pop(T, 13.0));
  }
  return [g, o];
}

const CFG = {
  penny: { scene: penny, total: 19.5, theme: ['#EAB308', '#22C55E', '#0D0A04'], photos: [], hits: [0.05, 2.8, 7.6 + 8 * 0.8, 15.6],
    foot: 'Math example: $0.01 doubled daily, day 30 = $5,368,709.12' },
  house: { scene: house, total: 15.5, theme: ['#3B82F6', '#DC2626', '#0B1430'], photos: ['suburb'], hits: [0.05, 3.4, 11.6],
    foot: 'Example: $400,000, 30-yr fixed at 7.18% (Freddie Mac avg, Nov 2026), principal & interest only · Not financial advice' },
};
const R = CFG[ID];
function frame(T) {
  for (const k in PH) PH[k].w.style.opacity = 0;
  const [g, o] = R.scene(T);
  let sh = 0; for (const t0 of R.hits) { const k = T - t0; if (k >= 0 && k < 0.35) sh = Math.max(sh, (1 - k / 0.35) * 14); }
  if (ID === 'penny' && T > 7.6 && T < 15.7) { const k = (T - 7.6) % 0.8; if (k < 0.2) sh = Math.max(sh, (1 - k / 0.2) * 6); }
  document.getElementById('cam').style.transform = sh ? `translate(${Math.sin(T * 91) * sh}px,${Math.cos(T * 77) * sh}px)` : '';
  let fl = 0; for (const t0 of R.hits) { const k = T - t0; if (k >= 0 && k < 0.25) fl = Math.max(fl, 0.6 * (1 - k / 0.25)); }
  document.getElementById('flash').style.opacity = fl;
  document.getElementById('svg').innerHTML = `<svg width="720" height="1280" viewBox="0 0 720 1280">${DEFS}${background(T, R.theme)}${g}</svg>`;
  document.getElementById('ov').innerHTML = o + `<div class="brand">THE MONEY <span class="y">MAP</span></div><div class="foot">${R.foot}</div>`;
}
window.TOTAL = R.total; window.READY = false;
document.fonts.ready.then(() => initPhotos(R.photos, window.CREDITS || {})).then(() => { frame(0.5); window.READY = true; });
window.render = frame;
</script>
</body></html>
